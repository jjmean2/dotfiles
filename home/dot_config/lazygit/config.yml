  theme:
    # 아래 세 색은 tmux 팔레트(~/.config/tmux/tmux.conf 2번 섹션)와 같은 값이다. YAML 이라 따로 적으므로 팔레트를 바꾸면 여기도 바꾼다.
    activeBorderColor: ["#b4befe", "bold"]  # 포커스된 패널 테두리 (@c_accent, 세션 뱃지 색)
    inactiveBorderColor: ["#45475a"]        # 나머지 패널 테두리 (@c_line)
    selectedLineBgColor: ["#313244"]        # 선택 줄 배경 (@c_surface)
    optionsTextColor: ["#89b4fa"]           # 하단 키 안내
    defaultFgColor: ["default"]             # 글자색은 터미널 기본

os:
  # 파일을 e 로 열 때: nvim 안($NVIM 있음)이면 그 nvim 의 새 탭에, 밖이면 새 nvim 을 띄운다.
  editPreset: "nvim-remote"
