# lazygit 설정. LG_CONFIG_FILE 로 가리킨다 (rc.sh, tmux.conf 의 prefix G).
#
# 두 환경에서 쓰인다.
#   - tmux prefix G 팝업: 이 파일만 적용. gui.theme 이 색을 정한다.
#   - nvim <leader>gg (snacks lazygit 모듈): 이 파일 뒤에 nvim 컬러스킴에서 만든 테마 파일이
#     덧붙어 gui.theme 을 덮어쓴다. 아래 테마는 팝업 쪽 기준으로 tmux 팔레트에 맞췄다.
# 키 목록은 lazygit 안에서 ? 로 본다. 전체 옵션: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Nerd Font 아이콘 (Ghostty 폰트가 지원). 아이콘이 깨지면 "" 로 끈다.
  nerdFontsVersion: "3"
  # 파일 아이콘 덧붙임: Node·프론트엔드 생태계 파일. lazygit 은 아이콘 표를 바이너리 안에 들고 있어
  # (pkg/gui/presentation/icons/file_icons.go) nvim 의 mini.icons 설정을 읽지 않는다. 내장 표에 이름이
  # 없어 확장자 아이콘(pnpm-workspace.yaml 은 YAML 의 느낌표)이나 기본 아이콘이 되는 것만 적었다.
  # 내장 표에 이미 전용 아이콘이 있는 것(package.json, tsconfig.json, eslint·tailwind 설정 등)은 그대로 둔다.
  # 목록과 글리프는 ~/.config/nvim/lua/plugins/icons.lua 와 같고 색은 nvim-web-devicons 의 브랜드 색이다.
  # 패턴이나 겹 확장자(.stories.tsx)는 지원하지 않아 이름을 하나씩 적는다.
  customIcons:
