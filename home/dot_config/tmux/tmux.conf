# ==============================================================================
# tmux 설정  (~/.config/tmux/tmux.conf, chezmoi 로 관리)
# ==============================================================================
#
# 방침
#   - 기본 키 바인딩은 바꾸지 않는다. 순정 tmux 에서도 손이 그대로 움직이도록
#     하기 위함이며, 여기서는 "동작 보강"과 "외관"만 손댄다.
#
# 명령어 표기
#   - set / set-option, setw / set-window-option 은 같은 명령의 축약형이다.
#   - -g : 전역(global) 값.  -s : 서버(server) 옵션.  -a : 기존 값에 덧붙임(append).
#   - 최근 tmux 는 윈도우 옵션도 set -g 로 지정 가능하지만, 윈도우 옵션임을
#     드러내고 싶은 곳에는 set-window-option 을 그대로 썼다.
#
# 반영 방법
#   - 대부분: prefix :  →  source-file ~/.config/tmux/tmux.conf
#   - 서버 옵션(focus-events, default-terminal, terminal-features)은 클라이언트를
#     분리(prefix d)했다가 다시 붙이거나(tmux a), 서버를 재시작해야 확실히 적용된다.
#   - extended-keys 는 source-file 만으로 적용되지만, 패널 안 프로그램이 모드를 다시
#     요청해야 하므로 Claude Code 등은 재시작한다.
#
# 섹션
#   1. 입력 및 동작      5. 윈도우 탭 스타일
#   2. 터미널 및 색상    6. 패널 테두리
#   3. 키 바인딩         7. 외부 설정 로드
#   4. 상태바 레이아웃
#


# ==============================================================================
# 1. 입력 및 동작 (Input & Behavior)
# ==============================================================================

# 마우스로 패널 선택/크기 조절, 휠 스크롤(복사 모드 자동 진입)을 허용한다.
# 키를 못 외웠을 때의 안전망 역할도 한다.
set-option -g mouse on

# 스크롤백 버퍼 줄 수 (기본값 2000). 긴 빌드 로그나 Claude Code 출력을 거슬러
# 올라가기엔 기본값이 부족하다. 새로 만드는 패널부터 적용된다.
set-option -g history-limit 10000

# 포커스 이벤트를 바깥 터미널에 요청하고 패널 안의 프로그램에 전달한다 (기본값 off).
# 켜면 tmux 안에서 패널을 옮길 때도 tmux 가 직접 focus-in/out 을 보낸다.
#
# 왜: nvim 은 FocusGained 시점에 열린 버퍼의 타임스탬프를 검사하고, 바깥에서 바뀐
#     파일을 'autoread' 로 다시 읽는다. 이 옵션이 없으면 tmux 안의 nvim 은 포커스
#     이벤트를 영영 받지 못해, 옆 패널(예: Claude Code)이 고친 파일이 화면에
#     반영되지 않고 :e 나 :checktime 을 직접 쳐야 한다. 낡은 버퍼 위에 :w 하면
#     덮어쓰기 사고로 이어진다.
# 주의: 이미 붙어 있는 클라이언트에는 적용되지 않는다. 분리 후 재접속할 것.
set-option -g focus-events on

# 수식키가 붙은 키(Shift+Enter, Ctrl+Shift+문자 등)를 패널 안 프로그램이 요청하면
# 구분해서 전달한다 (기본값 off). xterm 의 modifyOtherKeys 에 해당한다.
#
# 왜: Claude Code 는 시작할 때 modifyOtherKeys 모드 2 (ESC [ > 4 ; 2 m) 를 요청한다.
#     off 면 tmux 가 그 요청을 무시하고 패널을 VT100 호환 모드로 두어, Shift+Enter 를
#     Enter 와 같은 \r 로 뭉개 보내므로 줄바꿈 대신 프롬프트가 전송된다. Ghostty 는
#     Shift+Enter 를 처음부터 ESC [27;2;13~ 로 구분해 보내므로 깨지는 곳은 tmux 와
#     패널 사이뿐이다. on 이면 요청한 프로그램에만 확장 키를 보내고, htop 처럼 요청하지
#     않는 프로그램은 전과 같은 바이트를 받는다. always 는 요청하지 않은 프로그램에도
#     밀어 넣으므로 쓰지 않는다.
# 확인: Claude Code 가 떠 있는 패널에서 tmux display -p '#{pane_key_mode}' → "Ext 2".
#       source-file 뒤 Claude Code 를 다시 시작하면 적용된다 (재접속은 불필요).
set -s extended-keys on

# 확장 키를 패널에 쓸 때의 표기. csi-u 는 ESC [13;2u, 기본값 xterm 은 ESC [27;2;13~.
# Claude Code 는 둘 다 읽지만, csi-u 가 tmux 없이 Ghostty 가 직접 보내는 kitty 키보드
# 프로토콜 표기와 같아서 프로그램이 tmux 안팎에서 같은 바이트를 보게 된다.
#
# 이 옵션은 tmux 3.5 에서 생겼다. 이 파일은 Linux 에서도 읽히는데 배포판 tmux 는
# 더 오래된 경우가 많아(Ubuntu 24.04 = 3.4), 없는 버전에서는 "unknown option" 오류
# 화면이 뜨지 않도록 %if 로 감싼다. %if 는 tmux 3.0+ 의 설정 파일 조건문이고,
# #{>=:a,b} 는 포맷 비교 연산자다. 조건이 거짓이면 기본값 xterm 표기로 동작한다.
%if "#{>=:#{version},3.5}"
set -s extended-keys-format csi-u
%endif

# 복사 모드 키 바인딩: vi (prefix [ 로 진입, hjkl 이동, v 선택, y 복사).
# 명령줄(prefix :) 키 바인딩: emacs (C-a/C-e 로 줄 처음/끝, 셸과 같은 감각).
#
# 두 옵션의 기본값은 emacs 지만, man 페이지에 따르면 환경변수 VISUAL 또는 EDITOR 에
# 'vi' 가 포함되면 기본값이 vi 로 바뀐다. 환경에 따라 달라지지 않도록 둘 다 명시한다.
set-window-option -g mode-keys vi
set-option -g status-keys emacs


# ==============================================================================
# 2. 터미널 및 색상 (Terminal & Colors)
# ==============================================================================

# 패널 안 프로그램이 보게 될 TERM 값 (tmux 기본값과 같다).
#
# [terminfo 설치 배경 - 이 설명의 원본. 스크립트와 terminfo 파일 머리는 여기를 가리킨다]
#
# 문제: macOS 가 /usr/share/terminfo 에 넣어 둔 tmux-256color 항목은 오래된 ncurses
#   데이터베이스의 것이라 kf13 이후(Shift/Ctrl + F키) 정의가 없다. tmux 는 Shift+F3 를
#   패널에 \E[1;2R 로 써 주는데, 패널의 terminfo 에 kf15=\E[1;2R 이 없으면 htop 같은
#   ncurses 프로그램이 그 바이트를 키로 묶지 못한다.
# 해결: 같은 디렉토리의 tmux-256color.terminfo 는 Homebrew ncurses 6.6 의 공식 항목을
#   infocmp 로 뽑은 것이고, .chezmoiscripts/run_onchange_after_30-install-tmux-terminfo-darwin
#   이 macOS 의 /usr/bin/tic (ncurses 6.0.20150808) 으로 같은 이름으로 ~/.terminfo 에
#   컴파일한다. ncurses 는 ~/.terminfo 를 시스템 경로보다 먼저 찾으므로 이 사용자에게만
#   새 항목이 보이고 시스템 파일은 그대로다. Linux 배포판의 항목은 이미 완전해서 스크립트가
#   macOS 에서만 돈다.
# 알려진 차이: macOS tic 은 구형(16비트) 포맷으로 쓰기 때문에 pairs#0x10000 이 32767 로
#   잘려 저장된다. 색상 쌍을 그만큼 쓰는 프로그램은 없어 실용상 영향이 없다. 그 외 항목
#   (kf15, colors#256, Smulx 등)은 그대로 들어간다.
# 정리: 예전에 손으로 만들었던 ~/.terminfo/74/tmux-custom(kf15 하나만 덧붙인 것)은 더 이상
#   쓰지 않으므로 지워도 된다.
set -g default-terminal "tmux-256color"

# 바깥 터미널의 TERM 이 xterm-256color 일 때 24비트(RGB) 색을 쓸 수 있다고 알려준다.
#
# 왜: tmux 는 바깥 terminfo 에 Tc/RGB 능력이 있으면 자동으로 RGB 를 쓴다. Ghostty
#     (TERM=xterm-ghostty)는 terminfo 에 Tc 가 있어 이 줄 없이도 동작한다. 하지만
#     macOS Terminal.app, 일부 ssh 환경처럼 TERM=xterm-256color 로 들어오는 경우는
#     terminfo 가 RGB 를 알리지 않으므로 여기서 직접 선언해야 nvim 색이 깨지지 않는다.
# 형식: terminal-features 는 배열 옵션이라 -a 로 항목을 하나 덧붙인다.
#       항목은 "TERM패턴:기능[:기능...]" 이고, 앞의 쉼표는 문자열 구분자 관례로
#       tmux 가 빈 항목을 무시하므로 있어도 무방하다.
set -as terminal-features ",xterm-256color:RGB"

# Ghostty 가 확장 키(modifyOtherKeys)를 지원한다고 알린다.
#
# 왜: tmux 는 붙을 때 바깥 터미널에 modifyOtherKeys 모드 2 (ESC [ > 4 ; 2 m) 를 요청해
#     Ctrl+Shift+문자, Ctrl+숫자처럼 전통 표기가 없는 조합을 구분해 받는데, 그 요청은
#     바깥 터미널에 extkeys 기능이 있다고 인식될 때만 보낸다. tmux 는 붙을 때 XTVERSION
#     응답으로 터미널 종류를 알아보는데, 3.7 까지는 내장 목록에 Ghostty 가 없다.
#     Shift+Enter 자체는 이 줄 없이도 된다(1번 섹션 extended-keys 참고). 켜 두면 tmux 가
#     받는 키 정보가 온전해진다. Terminal.app 등은 지원하지 않으므로 Ghostty 로 한정한다.
# tmux 3.8 부터: Ghostty 를 자동 감지해 extkeys 를 포함한 기능 세트를 켜므로 이 줄은
#     필요 없다 (있어도 무해). tmux display -p '#{client_termfeatures}' 로 확인한다.
# 주의: 붙을 때 적용되므로 분리(prefix d) 후 다시 붙여야 한다. 끊길 때는 ESC [ > 4 m 로
#     되돌리며, 강제 종료로 되돌리지 못했으면 printf '\e[>4m' 또는 reset 으로 복구한다.
set -as terminal-features ",xterm-ghostty:extkeys"

# 참고: Ghostty 는 수식키가 붙은 F3 를 \E[13;2~ 로 보내는데 자기 terminfo 에는 \E[1;2R 로
# 적혀 있어, 한때 여기서 terminal-overrides 로 kf15 를 덮어 tmux 가 S-F3 를 알아보게 했다.
# 지금은 ~/.config/ghostty/terminfo.darwin.ghostty 와 .chezmoiscripts 의 보정 스크립트가
# terminfo 자체를 고쳐 두므로 tmux 클라이언트는 고쳐진 설명서를 그냥 읽는다. 같은 사실을
# 두 곳에 적지 않기 위해 여기서는 뺐다.


# ==============================================================================
# 3. 키 바인딩 (Key Bindings)
# ==============================================================================
# bind-key 는 -T 를 생략하면 prefix 테이블에 등록된다. 즉 "prefix 를 누른 뒤의 키".

# 새 윈도우/분할 패널이 현재 패널의 작업 디렉토리에서 열리도록 한다.
# 기본 동작은 세션을 시작한 디렉토리에서 열려서, 프로젝트 안에서 분할해도
# 매번 cd 를 다시 해야 했다. 키 자체(c, ", %)는 기본값 그대로다.
bind-key c   new-window     -c "#{pane_current_path}"
bind-key '"' split-window    -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"

# 패널 이동 키가 zoom(prefix z) 상태를 풀지 않도록 한다. 키 자체(;, o, 방향키, q)는 기본값
# 그대로이고 zoom 이 아닐 때의 동작도 기본과 같다.
#
# 왜: 기본 select-pane / last-pane 은 패널을 바꾸면서 zoom 도 해제한다. 에디터 + 터미널처럼
#     패널 두 개를 번갈아 전체 화면으로 쓰면 "이동 → 다시 prefix z" 가 매번 반복된다.
#     -Z 는 "zoom 되어 있었다면 유지" 라는 조건부 옵션(tmux 3.1+)이라 평소에는 바뀌는 게
#     없고, zoom 을 풀고 싶으면 전용 키 z 를 쓰면 된다. 즉 "zoom 을 바꾸는 키는 z 뿐".
#     tmux 자신도 prefix s / w 의 기본값을 choose-tree -Z 로 두어 같은 방향을 택하고 있다.
bind-key    \;    last-pane -Z              # 직전 패널로 토글
bind-key    o     select-pane -Z -t :.+    # 생성 순서로 다음 패널
bind-key -r Up    select-pane -Z -U        # -r : repeat-time(기본 500ms) 안에 연타 가능
bind-key -r Down  select-pane -Z -D        #      (기본값에도 -r 이 붙어 있다)
bind-key -r Left  select-pane -Z -L
bind-key -r Right select-pane -Z -R

# prefix q (display-panes) 도 zoom 을 유지한다. 3.8 의 display-panes 는 "panes 모드" 로,
# zoom 중에도 전체 레이아웃 미리보기 위에 번호를 그려 주므로 번호 표시 자체는 기본값으로
# 충분하다. 문제는 번호를 눌러 선택하는 순간 tmux 가 템플릿을 실행하기 전에 창을 unzoom
# 한다는 것이다 (그래서 템플릿에 select-pane -Z 를 써도 소용없다). 대신 선택 뒤
# resize-pane -Z 로 다시 zoom 한다. resize-pane -Z 는 토글이므로, zoom 이 아닐 때 눌렀다면
# zoom 이 되어 버리지 않도록 if-shell -F 로 키를 누른 시점의 zoom 여부를 보고 갈라 둔다.
# Esc / timeout 으로 취소하면 tmux 가 원상태를 복원하므로 별도 처리는 필요 없다.
bind-key q if-shell -F '#{window_zoomed_flag}' \
    { display-panes "select-pane -t '%%' ; resize-pane -Z" } \
    { display-panes }

# C-a 를 보조 prefix 로 추가한다. 기본 prefix(C-b)는 그대로 살아 있다.
#
# 왜: C-a 가 손에 편하지만 C-b 를 없애면 순정 환경에서 손이 꼬인다. 둘 다 두면
#     순정 머신에서는 C-b, 내 머신에서는 아무거나 써도 된다.
set-option -g prefix2 C-a

# prefix 를 누른 상태에서 C-a 를 한 번 더 누르면 C-a 문자 자체를 패널로 보낸다.
# (셸의 "줄 처음으로" 나 nvim 의 "숫자 증가" 를 C-a C-a 로 쓸 수 있게)
# send-prefix 는 prefix 옵션의 키를, -2 를 붙이면 prefix2 옵션의 키를 보낸다.
bind-key C-a send-prefix -2


# ==============================================================================
# 4. 상태바 레이아웃 (Status Bar)
# ==============================================================================

# 상태바 갱신 주기(초). 기본값과 같은 15 지만, 아래 status-right 의 gitmux 가 이
# 주기마다 git 명령을 실행하므로 "낮추면 비용이 든다" 는 걸 기억하기 위해 명시한다.
set -g status-interval 15

# 상태바 전체의 기본 배경/전경 색과 윈도우 목록 정렬.
# #[default] 로 되돌아갈 때 적용되는 색이 이것이다.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify left

# [좌측] 세션 이름 뱃지. 뒤에 붙은 " " 하나는 #[default] 로 색을 되돌린 공백이라
# 뱃지와 윈도우 목록 사이에 상태바 배경색 간격이 생긴다.
set -g status-left-length 40
set -g status-left "#[bg=#b4befe,fg=#181825,bold] #S #[default] "

# [우측] 현재 패널 디렉토리명(#{b:...} 는 basename) | gitmux 가 그린 git 상태 | 시각.
# gitmux 가 설치되어 있어야 한다 (brew install gitmux). 설정은 gitmux.conf 참고.
set -g status-right-length 80
set -g status-right '#[fg=colour14]#{b:pane_current_path} #(gitmux -cfg ~/.config/tmux/gitmux.conf "#{pane_current_path}") #[default]| %H:%M '

# ---- 상태바를 2줄로 만들고 첫 줄을 비워 패널과 상태바 사이에 여백을 둔다 ----
#
# status 를 2 로 올리면 status-format[0] (기본: 세션/윈도우 목록 줄) 과
# status-format[1] (기본: 패널 목록 줄) 두 줄이 그려진다. 우리가 원하는 것은
# "빈 줄 + 기존 상태바" 이므로, [0] 의 기본 포맷을 [1] 로 옮기고 [0] 은 비운다.
#
# 기본 포맷 문자열이 매우 길어 복사해 두지 않고 실행 시점에 읽어 쓴다. 그런데
# 이 파일을 다시 source 하면 [0] 이 이미 비어 있어 빈 값을 [1] 로 옮기게 되므로,
# 최초 1회에 원본을 @orig_status_format_* 사용자 옵션에 백업해 두고 이후에는
# 그 백업을 쓴다. [1] 백업은 현재 쓰이지 않지만 원복용으로 함께 보관한다.
#
# show-options 의 -v 는 값만, -g 는 전역 옵션을 뜻한다.
set -g status 2
run-shell '
  orig0="$(tmux show-options -gv @orig_status_format_0 2>/dev/null)"
  orig1="$(tmux show-options -gv @orig_status_format_1 2>/dev/null)"

  if [ -z "$orig0" ]; then
    orig0="$(tmux show-options -gv "status-format[0]")"
    tmux set-option -g @orig_status_format_0 "$orig0"
  fi

  if [ -z "$orig1" ]; then
    orig1="$(tmux show-options -gv "status-format[1]")"
    tmux set-option -g @orig_status_format_1 "$orig1"
  fi

  tmux set-option -g status-format[0] ""
  tmux set-option -g status-format[1] "$orig0"
'


# ==============================================================================
# 5. 윈도우 탭 스타일 (Window Tab Styling)
# ==============================================================================
# 상태바의 윈도우 목록(탭)을 꾸민다. 색은 아래 @변수에 모아 두고 포맷에서는
# #{E:@변수} 로 꺼내 쓴다. E: 는 "값을 한 번 더 포맷으로 확장" 하라는 뜻으로,
# 사용자 옵션 안의 #[...] 나 #{...} 가 실제로 해석되게 한다.

# 색상 정의. 여기만 고치면 전체 탭에 반영된다.
set -g @tab_bg            "#313244"   # 비활성 탭 배경
set -g @tab_fg            "#a6adc8"   # 비활성 탭 글자
set -g @tab_curr_bg       "colour68"  # 현재 탭 배경
set -g @tab_curr_fg       "#11111b"   # 현재 탭 글자
set -g @tab_sep_fg        "#45475a"   # 탭 사이 구분선
set -g @win_flag_curr_fg  "colour195" # 현재 탭의 플래그(#F) 색
set -g @win_flag_fg       "colour251" # 비활성 탭의 플래그 색

# 기본 스타일. *-style 은 바탕 스타일, *-format 은 내용이며 포맷 안의 #[default] 는
# 이 *-style 로 되돌아간다는 뜻이다.
set -g window-status-style         "fg=#{E:@tab_fg},bg=#{E:@tab_bg}"
set -g window-status-current-style "fg=#{E:@tab_curr_fg},bg=#{E:@tab_curr_bg},bold"

# 탭 구분선. 마지막 탭(window_end_flag)이 아닐 때만 탭 배경색 위에 세로선을 그린다.
# window-status-separator 를 쓰지 않고 포맷 끝에 직접 붙이는 이유는, 구분선 색을
# 탭 배경과 맞추고 마지막 탭 뒤에는 그리지 않기 위해서다.
set -g @tab_sep "#{?window_end_flag,,#[none]#[fg=#{E:@tab_sep_fg}]#[bg=#{E:@tab_bg}]│}"

# 윈도우 플래그(#F). 활동(#), 벨(!), 마지막 윈도우(-), 현재(*) 등을 표시하며
# 플래그가 있을 때만 공백과 함께 색을 입혀 붙인다.
set -g @win_flag_curr "#{?window_flags, #[fg=#{E:@win_flag_curr_fg}]#F,}"
set -g @win_flag      "#{?window_flags, #[fg=#{E:@win_flag_fg}]#F,}"

# 최종 포맷: " 번호:이름[플래그] │". 기본 구분선은 비우고 @tab_sep 로 대체한다.
set -g window-status-separator ""
set -g window-status-format         " #I:#W#{E:@win_flag} #{E:@tab_sep}"
set -g window-status-current-format " #I:#W#{E:@win_flag_curr} #{E:@tab_sep}"


# ==============================================================================
# 6. 패널 테두리 (Pane Border)
# ==============================================================================

# 각 패널 상단 테두리에 정보 줄을 표시한다 (기본값 off).
# 분할이 많아지면 어느 패널이 어디서 무엇을 돌리고 있는지 한눈에 보기 위함이다.
set -g pane-border-status top

# 테두리 색. 비활성은 은은한 회색, 활성은 굵은 하늘색으로 현재 패널을 드러낸다.
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=#00afff,bold"

# 테두리 정보 줄 포맷: "[패널 번호] 현재 경로 | 실행 중인 명령".
# 활성 패널은 밝은 색 + 굵게 + 밑줄, 비활성은 회색으로 구분한다.
set -g pane-border-format " #{?pane_active,#[fg=colour14]#[bold]#[underscore],#[fg=colour8]}[#P] #{pane_current_path} | #{pane_current_command} "


# ==============================================================================
# 7. 외부 설정 로드 (OS Specific & Local Overrides)
# ==============================================================================

# OS 별 설정과 머신 로컬 설정을 마지막에 읽어 위 내용을 덮어쓸 수 있게 한다.
# -q 는 파일이 없어도 오류를 내지 않는 옵션이다. 현재는 세 파일 모두 존재하지 않는다.
source-file -q ~/.tmux.conf.darwin
source-file -q ~/.tmux.conf.linux
source-file -q ~/.tmux.conf.local
