# ==============================================================================
# tmux 설정  (~/.config/tmux/tmux.conf, chezmoi 로 관리)
# ==============================================================================
#
# 방침
#   - 기본 키 바인딩은 바꾸지 않는다. 순정 tmux 에서도 손이 그대로 움직이도록
#     하기 위함이며, 여기서는 "동작 보강"과 "외관"만 손댄다.
#
# 명령어 표기
#   - set / set-option, setw / set-window-option 은 같은 명령의 축약형이다.
#   - -g : 전역(global) 값.  -s : 서버(server) 옵션.  -a : 기존 값에 덧붙임(append).
#   - 최근 tmux 는 윈도우 옵션도 set -g 로 지정 가능하지만, 윈도우 옵션임을
#     드러내고 싶은 곳에는 set-window-option 을 그대로 썼다.
#
# 반영 방법
#   - 대부분: prefix R  (= prefix :  →  source-file ~/.config/tmux/tmux.conf, "3. 키 바인딩" 절)
#   - 서버 옵션(focus-events, default-terminal, terminal-features)은 클라이언트를
#     분리(prefix d)했다가 다시 붙이거나(tmux a), 서버를 재시작해야 확실히 적용된다.
#   - extended-keys 는 source-file 만으로 적용되지만, 패널 안 프로그램이 모드를 다시
#     요청해야 하므로 Claude Code 등은 재시작한다.
#
# 섹션
#   1. 입력 및 동작      5. 윈도우 탭 스타일
#   2. 터미널 및 색상    6. 패널 테두리
#   3. 키 바인딩         7. 외부 설정과 확장 로드
#   4. 상태바 레이아웃
#


# ==============================================================================
# 1. 입력 및 동작 (Input & Behavior)
# ==============================================================================

# 마우스로 패널 선택/크기 조절, 휠 스크롤(복사 모드 자동 진입)을 허용한다.
# 키를 못 외웠을 때의 안전망 역할도 한다.
set-option -g mouse on

# 스크롤백 버퍼 줄 수 (기본값 2000). 긴 빌드 로그나 Claude Code 출력을 거슬러
# 올라가기엔 기본값이 부족하다. 새로 만드는 패널부터 적용된다.
set-option -g history-limit 10000

# 붙어 있는 세션이 사라지면(kill-session, 마지막 창 닫기 등) tmux 밖으로 떨어지지
# 않고 남은 세션 중 가장 최근에 활성화된 세션으로 옮겨 간다 (기본값 on = 클라이언트 분리).
#
# 왜: 세션을 지울 때마다 셸로 튕겨나가 tmux attach 를 다시 치는 게 번거롭다.
#     sessionizer 로 세션을 자주 만들고 지우는 흐름에서 특히 그렇다.
# 다른 값: no-detached (분리된 세션이 있을 때만 옮겨 감), previous / next (이름순 이웃).
# 주의: 서버 옵션이라 source-file 만 하면 이미 붙어 있는 클라이언트에도 바로 적용된다.
set-option -g detach-on-destroy off

# 윈도우를 닫으면 남은 윈도우 번호를 0, 1, 2… 로 다시 매긴다 (기본값 off = 구멍이 남는다).
#
# 왜: tmux-dev W 로 워크트리 윈도우를 자주 만들고 정리하다 보면 0:main 3:feat-a 7:fix-b 처럼 번호가 듬성듬성해져
#     prefix 숫자 키로 가기 어렵다. tmux-dev 는 윈도우를 번호가 아니라 window_id(@12 같은 고정 ID)로 다루고
#     번호는 피커의 ●N 표시에만 쓰므로, 번호가 바뀌어도 동작에는 영향이 없다.
set-option -g renumber-windows on

# 패널 안 프로그램이 울린 벨(BEL, \a)을 지금 보고 있지 않은 윈도우에서만 알린다 (기본값 any).
#
# 왜: 셸의 완성 실패, 빌드 스크립트의 `printf '\a'` 같은 일반 프로그램의 벨을 놓치지 않으려고. 다른 윈도우의 벨은
#     탭에 ! 플래그와 window-status-bell-style 색으로 남고(5번 섹션), 바깥 터미널에도 전달된다. Ghostty 는 기본
#     bell-features 로 소리 없이, 포커스가 없을 때 Dock 아이콘을 튀기고 탭 제목에 🔔 를 붙인다. 지금 보고 있는
#     윈도우의 벨은 이미 눈앞에 있으므로 무시한다 (any 로 바꿔도 보고 있는 윈도우에는 ! 가 붙지 않는다. 실측).
#     Claude Code 의 상태(작업 중·대기·끝남)는 벨이 아니라 agent-state 배지가 따로 보여 준다 (7번 섹션의 agent-state). 예전처럼 끝날 때 벨을 원하면 agent-state 플러그인 옵션 notify_via = bell.
# 관련 기본값(바꾸지 않음): monitor-bell on (벨을 감시), visual-bell off (메시지 대신 벨을 그대로 전달).
set-option -g bell-action other

# 패널 안 프로그램이 tmux 를 건너 바깥 터미널에 이스케이프를 보내는 것(DCS 패스스루 \ePtmux;…\e\\)을 허락한다.
# 안 보이는 패널에서도 허락한다(all). 기본값 off, on 은 보이는 패널만.
#
# 왜: agent-state 플러그인이 Claude 가 나를 기다리거나 끝나면 OSC 9 데스크톱 알림을 이 패스스루로 보낸다. 알림이 필요한 건
#     대개 뒤쪽 윈도우의 Claude 라서 on 으로는 부족하다(격리 서버 실측: on 은 안 보이는 패널의 패스스루를 버린다).
# 대가: 보이지 않는 패널의 프로그램도 바깥 터미널(Ghostty)에 아무 이스케이프나 보낼 수 있다. 이 머신의 패널에는 내가 띄운
#       프로그램만 돌므로 받아들인다. 끄려면 tmux.local.conf 에 set -g allow-passthrough on (알림은 보이는 패널만).
set-option -g allow-passthrough all

# 포커스 이벤트를 바깥 터미널에 요청하고 패널 안의 프로그램에 전달한다 (기본값 off).
# 켜면 tmux 안에서 패널을 옮길 때도 tmux 가 직접 focus-in/out 을 보낸다.
#
# 왜: nvim 은 FocusGained 시점에 열린 버퍼의 타임스탬프를 검사하고, 바깥에서 바뀐
#     파일을 'autoread' 로 다시 읽는다. 이 옵션이 없으면 tmux 안의 nvim 은 포커스
#     이벤트를 영영 받지 못해, 옆 패널(예: Claude Code)이 고친 파일이 화면에
#     반영되지 않고 :e 나 :checktime 을 직접 쳐야 한다. 낡은 버퍼 위에 :w 하면
#     덮어쓰기 사고로 이어진다.
# 주의: 이미 붙어 있는 클라이언트에는 적용되지 않는다. 분리 후 재접속할 것.
set-option -g focus-events on

# 수식키가 붙은 키(Shift+Enter, Ctrl+Shift+문자 등)를 패널 안 프로그램이 요청하면
# 구분해서 전달한다 (기본값 off). xterm 의 modifyOtherKeys 에 해당한다.
#
# 왜: Claude Code 는 시작할 때 modifyOtherKeys 모드 2 (ESC [ > 4 ; 2 m) 를 요청한다.
#     off 면 tmux 가 그 요청을 무시하고 패널을 VT100 호환 모드로 두어, Shift+Enter 를
#     Enter 와 같은 \r 로 뭉개 보내므로 줄바꿈 대신 프롬프트가 전송된다. Ghostty 는
#     Shift+Enter 를 처음부터 ESC [27;2;13~ 로 구분해 보내므로 깨지는 곳은 tmux 와
#     패널 사이뿐이다. on 이면 요청한 프로그램에만 확장 키를 보내고, htop 처럼 요청하지
#     않는 프로그램은 전과 같은 바이트를 받는다. always 는 요청하지 않은 프로그램에도
#     밀어 넣으므로 쓰지 않는다.
# 확인: Claude Code 가 떠 있는 패널에서 tmux display -p '#{pane_key_mode}' → "Ext 2".
#       source-file 뒤 Claude Code 를 다시 시작하면 적용된다 (재접속은 불필요).
set -s extended-keys on

# 확장 키를 패널에 쓸 때의 표기. csi-u 는 ESC [13;2u, 기본값 xterm 은 ESC [27;2;13~.
# Claude Code 는 둘 다 읽지만, csi-u 가 tmux 없이 Ghostty 가 직접 보내는 kitty 키보드
# 프로토콜 표기와 같아서 프로그램이 tmux 안팎에서 같은 바이트를 보게 된다.
#
# 이 옵션은 tmux 3.5 에서 생겼다. 이 파일은 Linux 에서도 읽히는데 배포판 tmux 는
# 더 오래된 경우가 많아(Ubuntu 24.04 = 3.4), 없는 버전에서는 "unknown option" 오류
# 화면이 뜨지 않도록 %if 로 감싼다. %if 는 tmux 3.0+ 의 설정 파일 조건문이고,
# #{>=:a,b} 는 포맷 비교 연산자다. 조건이 거짓이면 기본값 xterm 표기로 동작한다.
%if "#{>=:#{version},3.5}"
set -s extended-keys-format csi-u
%endif

# 확장 키를 요청하지 않는 Cursor CLI 에도 Shift+Enter 를 구분해 보낸다.
#
# 왜: extended-keys on 은 modifyOtherKeys 요청(ESC [ > 4 ; n m)을 받은 패널에만 확장 키를
#     보낸다. Cursor CLI 는 그 요청을 보내지 않아 패널이 VT10x 모드에 머물고(kitty 키보드
#     프로토콜만 쓰는 것으로 보이는데, tmux 는 패널 쪽에서 kitty 프로토콜을 지원하지 않는다),
#     Shift+Enter 가 \r 로 뭉개져 줄바꿈 대신 프롬프트가 전송된다. tmux 밖 Ghostty 에서는
#     kitty 표기 ESC [13;2u 를 받아 줄바꿈으로 처리하므로, 그 바이트를 그대로 넣어 준다.
# 판별: Cursor CLI(~/.local/bin/agent, 옛 이름 cursor-agent)는 셸 스크립트가 번들 node 를
#     exec -a 로 띄우는 구조라 pane_current_command 는 "node" 이고, argv[0] 에만
#     .../agent 가 남는다. pane_title 은 대화 주제에 따라 바뀌어 쓸 수 없다. 그래서 두 단계로 본다.
#     1) 형식(-F, fork 없음): 명령이 node 이고 && 패널이 아직 VT10x 모드인가.
#        Claude Code(Ext 2), 셸 등 대부분의 Shift+Enter 는 여기서 끝난다.
#     2) 1 이 참일 때만 ps: 그 패널 tty 의 전면 프로세스(stat 에 +)의 argv[0] 이름이
#        agent 또는 cursor-agent 인가. 매번 실제 프로세스를 보므로 따로 들고 있는 상태가 없다.
#     그 밖의 경우는 send-keys S-Enter 로 바인딩이 없을 때와 똑같이 패널 모드에 맞춰 보낸다.
#     나중에 Cursor 가 modifyOtherKeys 를 요청하게 되면 VT10x 조건이 거짓이 되어 이 우회는
#     저절로 꺼진다. -H 는 16진 바이트를 한 번에 쓴다 (ESC [ 1 3 ; 2 u).
#     ps -ww: 출력 폭을 자르지 않는다.  grep 의 " +": ps 가 stat 열을 공백으로 채운다.
# 확인: Cursor 패널에서 prefix : → run-shell "ps -ww -o stat=,args= -t #{s|/dev/||:pane_tty}"
# 3.5+ 로 감싼 이유: pane_key_mode 가 3.5 에서 생겼고, 3.4 의 send-keys 는 S-Enter 를
#     키 이름으로 알아보지 못해 "S-Enter" 라는 글자를 그대로 입력한다.
%if "#{>=:#{version},3.5}"
bind-key -n S-Enter if-shell -F '#{&&:#{==:#{pane_current_command},node},#{==:#{pane_key_mode},VT10x}}' {
    if-shell "ps -ww -o stat=,args= -t '#{s|/dev/||:pane_tty}' | grep -Eq '^[^ ]*[+] +([^ ]*/)?(cursor-)?agent '" \
        { send-keys -H 1b 5b 31 33 3b 32 75 } \
        { send-keys S-Enter }
} { send-keys S-Enter }
%endif

# 복사 모드 키 바인딩: vi (prefix [ 로 진입, hjkl 이동, Space 선택 시작, Enter 복사, v 사각형 선택 전환).
# 명령줄(prefix :) 키 바인딩: emacs (C-a/C-e 로 줄 처음/끝, 셸과 같은 감각).
#
# 두 옵션의 기본값은 emacs 지만, man 페이지에 따르면 환경변수 VISUAL 또는 EDITOR 에
# 'vi' 가 포함되면 기본값이 vi 로 바뀐다. 환경에 따라 달라지지 않도록 둘 다 명시한다.
set-window-option -g mode-keys vi
set-option -g status-keys emacs

# 복사 모드에서 y 로도 복사하고 나간다 (Enter 와 같다). 순정 vi 테이블에서 y 는 비어 있어 덮어쓰는 키가 아니다.
# 왜: nvim 의 y(yank) 와 같은 손 동작. v 는 순정이 rectangle-toggle 이라 그대로 둔다 (선택 시작은 Space).
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# 패널 안 프로그램이 OSC 52 로 클립보드에 쓰는 것을 받아 바깥 터미널(시스템 클립보드)로 넘긴다 (기본값 external).
#
#   external : tmux 자신의 복사(복사 모드, 마우스 드래그)만 바깥 클립보드로 보낸다. 패널 안 프로그램의
#              OSC 52 는 버린다.
#   on       : 위에 더해 패널 안 프로그램의 OSC 52 도 tmux 버퍼에 담고 바깥 클립보드로 넘긴다.
#
# 왜: ssh 너머나 dev container 안의 nvim·Claude Code 처럼 pbcopy 를 부를 수 없는 프로그램은 OSC 52 로만
#     로컬 클립보드에 닿는다. external 에서는 tmux 가 그걸 삼켜 복사가 조용히 실패한다.
# 전제: 바깥 터미널이 clipboard 기능을 알려야 한다. Ghostty 는 tmux 3.8 이 자동 감지하고, xterm* 은 tmux 내장
#       목록에 있다. 확인: tmux display -p '#{client_termfeatures}' 에 clipboard 가 있는지.
# 보안: 패널 안 프로그램이 클립보드에 "쓸" 수만 있다. 읽기(OSC 52 조회)는 get-clipboard 옵션(기본 off)이 막는다.
# 확인: 패널에서 printf '\e]52;c;%s\a' "$(printf hi | base64)" 뒤 pbpaste → hi
set -s set-clipboard on


# ==============================================================================
# 2. 터미널 및 색상 (Terminal & Colors)
# ==============================================================================

# 패널 안 프로그램이 보게 될 TERM 값 (tmux 기본값과 같다).
#
# [terminfo 설치 배경 - 이 설명의 원본. 스크립트와 terminfo 파일 머리는 여기를 가리킨다]
#
# 문제: macOS 가 /usr/share/terminfo 에 넣어 둔 tmux-256color 항목은 오래된 ncurses
#   데이터베이스의 것이라 kf13 이후(Shift/Ctrl + F키) 정의가 없다. tmux 는 Shift+F3 를
#   패널에 \E[1;2R 로 써 주는데, 패널의 terminfo 에 kf15=\E[1;2R 이 없으면 htop 같은
#   ncurses 프로그램이 그 바이트를 키로 묶지 못한다.
# 해결: 같은 디렉토리의 tmux-256color.terminfo 는 Homebrew ncurses 6.6 의 공식 항목을
#   infocmp 로 뽑은 것이고, .chezmoiscripts/run_onchange_after_30-install-tmux-terminfo-darwin
#   이 macOS 의 /usr/bin/tic (ncurses 6.0.20150808) 으로 같은 이름으로 ~/.terminfo 에
#   컴파일한다. ncurses 는 ~/.terminfo 를 시스템 경로보다 먼저 찾으므로 이 사용자에게만
#   새 항목이 보이고 시스템 파일은 그대로다. Linux 배포판의 항목은 이미 완전해서 스크립트가
#   macOS 에서만 돈다.
# 알려진 차이: macOS tic 은 구형(16비트) 포맷으로 쓰기 때문에 pairs#0x10000 이 32767 로
#   잘려 저장된다. 색상 쌍을 그만큼 쓰는 프로그램은 없어 실용상 영향이 없다. 그 외 항목
#   (kf15, colors#256, Smulx 등)은 그대로 들어간다.
# 정리: 예전에 손으로 만들었던 ~/.terminfo/74/tmux-custom(kf15 하나만 덧붙인 것)은 더 이상
#   쓰지 않으므로 지워도 된다.
set -g default-terminal "tmux-256color"

# 바깥 터미널의 TERM 이 xterm-256color 일 때 24비트(RGB) 색을 쓸 수 있다고 알려준다.
#
# 왜: tmux 는 바깥 terminfo 에 Tc/RGB 능력이 있으면 자동으로 RGB 를 쓴다. Ghostty
#     (TERM=xterm-ghostty)는 terminfo 에 Tc 가 있어 이 줄 없이도 동작한다. 하지만
#     macOS Terminal.app, 일부 ssh 환경처럼 TERM=xterm-256color 로 들어오는 경우는
#     terminfo 가 RGB 를 알리지 않으므로 여기서 직접 선언해야 nvim 색이 깨지지 않는다.
# 형식: terminal-features 는 배열 옵션이라 -a 로 항목을 하나 덧붙인다.
#       항목은 "TERM패턴:기능[:기능...]" 이고, 앞의 쉼표는 문자열 구분자 관례로
#       tmux 가 빈 항목을 무시하므로 있어도 무방하다.
set -as terminal-features ",xterm-256color:RGB"

# Ghostty 가 확장 키(modifyOtherKeys)를 지원한다고 알린다.
#
# 왜: tmux 는 붙을 때 바깥 터미널에 modifyOtherKeys 모드 2 (ESC [ > 4 ; 2 m) 를 요청해
#     Ctrl+Shift+문자, Ctrl+숫자처럼 전통 표기가 없는 조합을 구분해 받는데, 그 요청은
#     바깥 터미널에 extkeys 기능이 있다고 인식될 때만 보낸다. tmux 는 붙을 때 XTVERSION
#     응답으로 터미널 종류를 알아보는데, 3.7 까지는 내장 목록에 Ghostty 가 없다.
#     Shift+Enter 자체는 이 줄 없이도 된다(1번 섹션 extended-keys 참고). 켜 두면 tmux 가
#     받는 키 정보가 온전해진다. Terminal.app 등은 지원하지 않으므로 Ghostty 로 한정한다.
# tmux 3.8 부터: Ghostty 를 자동 감지해 extkeys 를 포함한 기능 세트를 켜므로 이 줄은
#     필요 없다 (있어도 무해). tmux display -p '#{client_termfeatures}' 로 확인한다.
# 주의: 붙을 때 적용되므로 분리(prefix d) 후 다시 붙여야 한다. 끊길 때는 ESC [ > 4 m 로
#     되돌리며, 강제 종료로 되돌리지 못했으면 printf '\e[>4m' 또는 reset 으로 복구한다.
set -as terminal-features ",xterm-ghostty:extkeys"

# 참고: Ghostty 는 수식키가 붙은 F3 를 \E[13;2~ 로 보내는데 자기 terminfo 에는 \E[1;2R 로
# 적혀 있어, 한때 여기서 terminal-overrides 로 kf15 를 덮어 tmux 가 S-F3 를 알아보게 했다.
# 지금은 ~/.config/ghostty/terminfo.darwin.ghostty 와 .chezmoiscripts 의 보정 스크립트가
# terminfo 자체를 고쳐 두므로 tmux 클라이언트는 고쳐진 설명서를 그냥 읽는다. 같은 사실을
# 두 곳에 적지 않기 위해 여기서는 뺐다.

# ---- 팔레트 ----
#
# 상태바·탭·떠 있는 패널·메뉴가 쓰는 색을 여기 한 곳에 적고, 쓰는 곳에서는 #{@c_이름} 으로 꺼낸다.
# 값은 Catppuccin Mocha 의 중립색과 라벤더다. 바깥 터미널(Ghostty, 테마 Snazzy)의 어두운 바탕 위에 놓인다고 보고 골랐다.
#
# 왜 사용자 옵션인가: 스타일 옵션(status-style, window-status-style …)과 포맷 안의 #[fg=…] 는 그릴 때마다
#     포맷으로 펼쳐지므로 색 자리에 #{@c_accent} 를 그대로 적을 수 있다. 값을 한 곳에서만 바꾸면 되고,
#     지금 서버에서 바로 바꿔 볼 수도 있다:  tmux set -g @c_accent '#89b4fa'   (쓰는 곳이 모두 따라온다)
#     머신마다 다르게 하려면 tmux.local.conf 에 같은 줄을 적는다.
# 예외: 강조색은 %hidden 변수(C_ACCENT)에 먼저 적고 옵션으로 옮긴다. 3번 섹션의 떠 있는 패널 테두리
#     (@float-border-style)에는 포맷 참조가 아니라 값이 들어가야 해서다. tmux-dev 피커가 그 문자열에서
#     fg= 값을 읽어 fzf 의 --color 로 넘긴다 (plugins/tmux-dev/lib/picker.sh 의 float_border).
#     그래서 떠 있는 패널 테두리만은 위의 tmux set 으로 따라오지 않고, 이 파일을 다시 읽어야 바뀐다.
# 같이 바꿀 곳: ~/.config/lazygit/config.yml 의 theme (YAML 이라 값을 따로 적어 둔다).
%hidden C_ACCENT='#b4befe'
set -g @c_accent  "$C_ACCENT"   # "여기": 세션 뱃지, 떠 있는 패널 테두리, 선택한 줄
set -g @c_mode    "#fab387"     # 입력이 평소와 다르다: prefix 를 누른 동안의 뱃지
set -g @c_surface "#313244"     # 살짝 뜬 면: 탭 바탕
set -g @c_line    "#45475a"     # 선: 탭 구분선
set -g @c_sub     "#a6adc8"     # 보조 글자: 비활성 탭
set -g @c_text    "#cdd6f4"     # 보통 글자
set -g @c_ink     "#11111b"     # 칠한 면 위의 글자
set -g @c_green   "#a6e3a1"
set -g @c_yellow  "#f9e2af"
# 신호색: 내가 움직여야 하는 것에만 쓴다. 위 색들보다 일부러 채도를 높였다 (파스텔은 어두운 바탕에서 눈에 덜 띄었다).
# 쓰는 곳: 확장이 "주의" 를 올린 탭의 바탕(5번 섹션의 @slot_tab_alert), 그리고 확장이 자기 아이콘 색의 기본값으로 읽어 간다.
set -g @c_attn    "#ffc400"     # 나를 기다린다
set -g @c_err     "#ff3d5a"     # 오류
set -g @c_ok      "#22e06b"     # 끝났다
set -g @c_run     "#3b9eff"     # 하는 중

# ---- 프롬프트·선택·메뉴 ----
#
# 상태바 밖에서 tmux 가 그리는 면들. 지정하지 않으면 tmux 3.8 은 테마 색(themeyellow, themedarkgrey …)으로 칠하는데,
# 테마는 바깥 터미널이 밝은지 어두운지를 탐지해 고른 색 묶음이다 (theme 옵션, 기본 detect).
# 왜: 위 팔레트는 어두운 바탕에 맞춰 고정한 값이라, 탐지 결과에 따라 이 면들만 다른 색 묶음으로 바뀌면 어긋난다
#     (2026-11-22 이 머신의 Ghostty 클라이언트는 어두운 바탕인데도 #{client_theme} 가 light 였다. 원인은 못 밝혔다).
#     같은 팔레트로 적어 두면 탐지 결과와 상관없이 같게 나온다.
# 구조는 순정 값을 따른다: 메시지·프롬프트는 눈에 띄는 노란 줄, 선택한 줄은 밝은 면 + 어두운 글자, 메뉴는 어두운 면.
# message-* 의 fill= 조건도 순정 값에서 가져왔다 (상태줄 한 줄을 다 칠하되, 패널·모드 안의 프롬프트에서는 칠하지 않는다).
# popup-* 는 적지 않는다. 팝업 대신 떠 있는 패널을 쓰고(3번 섹션의 @float-*), 그 옵션들은 tmux 3.9 에서 없어진다.
set -g message-style         "bg=#{@c_yellow},fg=#{@c_ink},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@c_yellow}}"
set -g message-command-style "bg=#{@c_ink},fg=#{@c_yellow},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{@c_ink}}"
set -g mode-style            "noattr,bg=#{@c_accent},fg=#{@c_ink}"
set -g menu-style            "bg=#{@c_surface},fg=#{@c_text}"
set -g menu-selected-style   "bg=#{@c_accent},fg=#{@c_ink}"
set -g menu-border-style     "bg=#{@c_surface},fg=#{@c_sub}"
set -g copy-mode-match-style         "bg=#{@c_yellow},fg=#{@c_ink}"
set -g copy-mode-current-match-style "bg=#{@c_mode},fg=#{@c_ink}"


# ==============================================================================
# 3. 키 바인딩 (Key Bindings)
# ==============================================================================
# bind-key 는 -T 를 생략하면 prefix 테이블에 등록된다. 즉 "prefix 를 누른 뒤의 키".

# 새 윈도우/분할 패널이 현재 패널의 작업 디렉토리에서 열리도록 한다.
# 기본 동작은 세션을 시작한 디렉토리에서 열려서, 프로젝트 안에서 분할해도
# 매번 cd 를 다시 해야 했다. 키 자체(c, ", %)는 기본값 그대로다.
bind-key c   new-window     -c "#{pane_current_path}"
bind-key '"' split-window    -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"

# 새 floating pane 을 현재 패널의 디렉토리에서 연다.
# 순정 prefix * (new-pane, tmux 3.8+) 는 -c 가 없어 세션 시작 디렉토리에서 열린다. 위의
# c / " / % 처럼 덮어쓰지 않고 그대로 둔 것은 "세션 루트에서 열기" 도 따로 쓰고 싶어서다.
#   prefix *  세션 시작 디렉토리 (순정)
#   prefix +  현재 패널의 디렉토리
# 키: + 는 비어 있고(순정·이 설정 모두), * 와 같이 "패널을 하나 더한다" 로 읽혀 짝을 이룬다.
bind-key + new-pane -c "#{pane_current_path}"

# prefix R: 이 설정 파일을 다시 읽는다 (prefix : → source-file ~/.config/tmux/tmux.conf 를 줄인 것).
# 키: R 은 순정 tmux 에서 비어 있다. 소문자 r 은 순정 refresh-client(화면 다시 그리기)라 건드리지 않는다.
#     tmux-sensible 도 R 이 비어 있으면 같은 "설정 다시 읽기" 를 묶는, 널리 쓰이는 관례다.
# 동작: 파일 안에 잘못된 줄이 있으면 tmux 가 그 오류를 알리고, 나머지 줄은 그대로 적용한 뒤 "Reloaded" 도 띄운다.
#       파일 자체를 못 읽을 때(경로가 없을 때 등)만 source-file 이 실패해 알림 없이 멈춘다.
#       즉 "Reloaded" 가 보여도 오류 알림이 함께 떴다면 일부 줄은 적용되지 않은 것이다.
#       다시 읽기만으로 안 바뀌는 것(서버 옵션 등)은 머리말 "반영 방법" 참고.
bind-key R {
    source-file ~/.config/tmux/tmux.conf
    display-message "Reloaded ~/.config/tmux/tmux.conf"
}

# 패널 이동 키가 zoom(prefix z) 상태를 풀지 않도록 한다. 키 자체(;, o, 방향키, q)는 기본값
# 그대로이고 zoom 이 아닐 때의 동작도 기본과 같다.
#
# 왜: 기본 select-pane / last-pane 은 패널을 바꾸면서 zoom 도 해제한다. 에디터 + 터미널처럼
#     패널 두 개를 번갈아 전체 화면으로 쓰면 "이동 → 다시 prefix z" 가 매번 반복된다.
#     -Z 는 "zoom 되어 있었다면 유지" 라는 조건부 옵션(tmux 3.1+)이라 평소에는 바뀌는 게
#     없고, zoom 을 풀고 싶으면 전용 키 z 를 쓰면 된다. 즉 "zoom 을 바꾸는 키는 z 뿐".
#     tmux 자신도 prefix s / w 의 기본값을 choose-tree -Z 로 두어 같은 방향을 택하고 있다.
bind-key    \;    last-pane -Z              # 직전 패널로 토글
bind-key    o     select-pane -Z -t :.+    # 생성 순서로 다음 패널
bind-key -r Up    select-pane -Z -U        # -r : repeat-time(기본 500ms) 안에 연타 가능
bind-key -r Down  select-pane -Z -D        #      (기본값에도 -r 이 붙어 있다)
bind-key -r Left  select-pane -Z -L
bind-key -r Right select-pane -Z -R

# prefix q (display-panes) 도 zoom 을 유지한다. 3.8 의 display-panes 는 "panes 모드" 로,
# zoom 중에도 전체 레이아웃 미리보기 위에 번호를 그려 주므로 번호 표시 자체는 기본값으로
# 충분하다. 문제는 번호를 눌러 선택하는 순간 tmux 가 템플릿을 실행하기 전에 창을 unzoom
# 한다는 것이다 (그래서 템플릿에 select-pane -Z 를 써도 소용없다). 대신 선택 뒤
# resize-pane -Z 로 다시 zoom 한다. resize-pane -Z 는 토글이므로, zoom 이 아닐 때 눌렀다면
# zoom 이 되어 버리지 않도록 if-shell -F 로 키를 누른 시점의 zoom 여부를 보고 갈라 둔다.
# Esc / timeout 으로 취소하면 tmux 가 원상태를 복원하므로 별도 처리는 필요 없다.
bind-key q if-shell -F '#{window_zoomed_flag}' \
    { display-panes "select-pane -t '%%' ; resize-pane -Z" } \
    { display-panes }

# C-a 를 보조 prefix 로 추가한다. 기본 prefix(C-b)는 그대로 살아 있다.
#
# 왜: C-a 가 손에 편하지만 C-b 를 없애면 순정 환경에서 손이 꼬인다. 둘 다 두면
#     순정 머신에서는 C-b, 내 머신에서는 아무거나 써도 된다.
set-option -g prefix2 C-a

# prefix 를 누른 상태에서 C-a 를 한 번 더 누르면 C-a 문자 자체를 패널로 보낸다.
# (셸의 "줄 처음으로" 나 nvim 의 "숫자 증가" 를 C-a C-a 로 쓸 수 있게)
# send-prefix 는 prefix 옵션의 키를, -2 를 붙이면 prefix2 옵션의 키를 보낸다.
bind-key C-a send-prefix -2

# 떠 있는 창(floating pane) 스타일. 기본값은 일반 패널과 같은 배경이라 아래 패널과 구분이 안 된다.
# 배경을 터미널(Ghostty Snazzy #1e1f29)보다 한 단계만 밝게 두어 "떠 있는 창" 으로 구분하고,
# 테두리는 상태바 세션 뱃지(#b4befe)와 같은 강조색, 선은 single (rounded 는 tmux 3.9 부터라 3.8 의 new-pane -B 가 거부한다). fg=default 는 글자색을 터미널 그대로 쓰라는 뜻이다.
#
# 값은 %hidden 변수에 한 번만 적는다. %hidden 은 설정 파일 안에서만 보이는 변수로, 설정을 읽는 순간
# $이름 이 값으로 바뀐다 ({ } 블록 안에서도). 그래서 아래 키 바인딩보다 앞에 둔다.
#   - floating pane 에는 전역 스타일 옵션이 없어 띄우는 명령에 넘긴다: G / e / H 는 new-pane 의 -s/-S/-R/-B 로
#     (설정을 읽을 때 고정된다. 바꾸면 source-file 로 다시 읽는다).
#   - 사용자 옵션 @float-* 에도 옮겨 적는다. tmux-dev 의 prefix S·W 는 키를 누를 때 이것을 읽어 new-pane -s 로 넘긴다
#     (prefix : 에서 set -g @float-style ... 로 바꾸면 S·W 는 바로 따라간다).
#   - 테두리 색은 팔레트의 강조색이다. 포맷 참조(#{@c_accent})가 아니라 값($C_ACCENT)으로 넣는 이유는 2번 섹션 팔레트의 "예외".
%hidden FLOAT_STYLE='bg=#24253a,fg=default'
%hidden FLOAT_BORDER_STYLE="fg=$C_ACCENT"
%hidden FLOAT_BORDER_LINES='single'
set -g @float-style "$FLOAT_STYLE"
set -g @float-border-style "$FLOAT_BORDER_STYLE"
set -g @float-border-lines "$FLOAT_BORDER_LINES"

# 도구를 floating pane 으로 띄우는 키들 (G, e, H). 공통 형태:
#   new-pane -A -x 90% -y 90% -s … -S … -R … -B … <명령> ; move-pane -P centre
#
# floating pane 은 창 위에 떠 있는 진짜 패널이다. 팝업과 달리 modal 이 아니라서(-O 를 쓰지 않는다) 띄운 채로
# prefix ; / 방향키로 아래 패널에 갔다가 돌아올 수 있고, prefix @ 로 타일 패널로 내려놓을 수도 있다.
# 명령이 끝나면(lazygit 의 q, nvim 의 :q) 패널도 닫힌다 (remain-on-exit 기본값 off).
#   -A          zoom 상태면 zoom 을 풀지 않고 그 위에 띄운다. "zoom 을 바꾸는 키는 z 뿐" 방침과 같다.
#   -x/-y       크기. % 는 창 크기 기준이고 테두리를 포함한다.
#   -s          패널 배경·글자. -S / -R 은 포커스가 있을 때 / 없을 때의 테두리. 둘 다 같은 강조색으로 둔다.
#   move-pane -P centre
#               floating pane 의 기본 위치는 왼쪽 위에서 계단식으로 밀려 나간다. -X/-Y 를 % 로 주면 크기와 위치가
#               따로 버림돼 한 칸씩 어긋나므로, 띄운 뒤 가운데로 옮긴다. new-pane 이 새 패널을 "현재 패널" 로
#               만들어 두므로 같은 블록의 move-pane 은 새 패널을 옮긴다 (순정 prefix Tab 도 같은 방식).
#   ; 로 한 줄에 잇기
#               설정 파일의 { } 블록은 줄마다 따로 명령 그룹이 되고, 명령이 실패하면 같은 그룹의 나머지만 지워진다.
#               두 줄로 나누면 new-pane 이 실패해도 move-pane 이 원래 (타일) 패널을 대상으로 돌아 "pane is not
#               floating" 을 내고, 상태줄에는 그 마지막 오류만 남아 진짜 원인이 가려진다. 같은 줄에 ; 로 이어 두면
#               new-pane 이 실패할 때 move-pane 도 함께 빠지고 new-pane 의 오류가 그대로 보인다.
# 제목은 따로 달지 않는다. 전역 pane-border-status top 이 floating pane 에도 걸려서 테두리 위에
# "[번호] 경로 | 명령" 이 이미 나온다 (7. 패널 테두리).

# lazygit. 스테이징, 커밋, 브랜치, 로그 같은 저장소 단위 git 작업은 여기서 한다
# (편집 중 hunk 단위 조작은 nvim 의 gitsigns, <leader>g*).
# -c 로 현재 패널의 디렉토리에서 열어 그 프로젝트의 저장소를 본다.
# 키: g 는 tmux 3.8 이 switch-client -T move 에 쓰고 있어 비어 있는 G 를 쓴다.
# -e 로 lazygit 설정 파일 위치를 넘긴다 (셸 프로필의 LG_CONFIG_FILE 과 같은 값. tmux 서버는
# 자기가 시작될 때의 환경을 쓰므로 프로필 변경이 바로 반영되지 않아 명시한다).
bind-key G {
  new-pane -A -c "#{pane_current_path}" -x 90% -y 90% \
    -s "$FLOAT_STYLE" -S "$FLOAT_BORDER_STYLE" -R "$FLOAT_BORDER_STYLE" -B "$FLOAT_BORDER_LINES" \
    -e "LG_CONFIG_FILE=$HOME/.config/lazygit/config.yml" lazygit ; move-pane -P centre
}

# nvim, 현재 패널의 디렉토리에서. 레이아웃을 건드리지 않고 파일 하나를 잠깐 보거나 고칠 때 쓴다.
# :q 로 nvim 이 끝나면 패널도 닫힌다. 오래 붙잡고 할 편집이 되면 prefix @ 로 타일 패널로 내려놓는다.
# 키: e 는 비어 있다 (E 는 순정 select-layout -E).
bind-key e {
  new-pane -A -c "#{pane_current_path}" -x 90% -y 90% \
    -s "$FLOAT_STYLE" -S "$FLOAT_BORDER_STYLE" -R "$FLOAT_BORDER_STYLE" -B "$FLOAT_BORDER_LINES" \
    nvim ; move-pane -P centre
}

# 개인 치트시트(~/.config/nvim/doc/jw.txt)의 tmux 절. nvim 의 순정 help 로 열고
# +only 로 help 창만 남긴다. :q 로 닫는다. H 는 비어 있는 키다.
bind-key H {
  new-pane -A -x 90% -y 90% \
    -s "$FLOAT_STYLE" -S "$FLOAT_BORDER_STYLE" -R "$FLOAT_BORDER_STYLE" -B "$FLOAT_BORDER_LINES" \
    nvim -R "+help jw-tmux" +only ; move-pane -P centre
}

# floating pane 을 칸 단위로 옮기고 크기를 바꾼다. 순정 prefix g 가 들어가는 move 테이블에 더한다.
#   prefix g  h/j/k/l    왼쪽/아래/위/오른쪽으로 1칸 이동
#   prefix g  H/J/K/L    같은 방향으로 5칸 이동
#   prefix g  M-h/M-l    폭 1칸 줄이기/늘리기   (오른쪽 테두리를 옮긴다)
#   prefix g  M-k/M-j    높이 1칸 줄이기/늘리기 (아래 테두리를 옮긴다)
#   prefix g  Esc        모드에서 나온다
# 순정 move 테이블에는 방향키(가장자리로), 1~4(모서리로), 0(창 채우기)만 있어 hjkl 은 비어 있다.
# 왜 prefix 아래 다른 키가 아닌가: 방향키 계열은 모두 쓰인다. ←↑↓→ 는 패널 선택(위), S-←↑↓→ 는 보이는 영역
#   이동(refresh-client), C-/M-←↑↓→ 는 크기 조절(1칸/5칸). "크게 옮기기" 와 "한 칸씩 옮기기" 를 한 테이블에 둔다.
# 시간 제한 없이 머무는 모드: 각 키가 일을 한 뒤 switch-client -T move 로 테이블에 다시 들어간다. 그래서
#   prefix g l l l j j M-l M-l 처럼 위치를 보면서 천천히 맞추고 Esc 로 끝낸다. -r 은 repeat-time(기본 500ms)
#   안에 다음 키를 눌러야 해서 쓰지 않는다.
#   - Esc 는 이 테이블의 바인딩이라 패널(nvim 등)로 가지 않는다.
#   - 테이블에 없는 키를 누르면 tmux 가 root 테이블로 돌아가 그 키를 root 에서 찾는다. root 바인딩(M-S-Up 등)이면
#     실행되고, 아니면 패널로 보내지 않고 버린다. 즉 모드 중에 친 엉뚱한 글자가 셸에 들어가지 않는다.
#   - 순정 키(방향키, 1~4, 0, 메뉴 , .)는 한 번 실행하고 모드에서 나온다 (가장자리·모서리로 보내면 끝이므로).
# 크기는 왼쪽 위 모서리를 고정하고 오른쪽·아래 테두리를 옮긴다. floating pane 에서 resize-pane -R/-D 는 그 테두리를
#   움직이고 음수를 받는다 (순정 prefix C-Left 도 floating 이면 resizep -R-1).
# if -F: tiled 패널에서는 아무 일도 하지 않는다 (resize-pane 은 tiled 에서도 동작해서 레이아웃이 바뀌어 버린다).
bind-key -T move h   { if -F '#{pane_floating_flag}' { move-pane -L } ; switch-client -T move }
bind-key -T move j   { if -F '#{pane_floating_flag}' { move-pane -D } ; switch-client -T move }
bind-key -T move k   { if -F '#{pane_floating_flag}' { move-pane -U } ; switch-client -T move }
bind-key -T move l   { if -F '#{pane_floating_flag}' { move-pane -R } ; switch-client -T move }
bind-key -T move H   { if -F '#{pane_floating_flag}' { move-pane -L 5 } ; switch-client -T move }
bind-key -T move J   { if -F '#{pane_floating_flag}' { move-pane -D 5 } ; switch-client -T move }
bind-key -T move K   { if -F '#{pane_floating_flag}' { move-pane -U 5 } ; switch-client -T move }
bind-key -T move L   { if -F '#{pane_floating_flag}' { move-pane -R 5 } ; switch-client -T move }
bind-key -T move M-h { if -F '#{pane_floating_flag}' { resize-pane -R-1 } ; switch-client -T move }
bind-key -T move M-l { if -F '#{pane_floating_flag}' { resize-pane -R 1 } ; switch-client -T move }
bind-key -T move M-k { if -F '#{pane_floating_flag}' { resize-pane -D-1 } ; switch-client -T move }
bind-key -T move M-j { if -F '#{pane_floating_flag}' { resize-pane -D 1 } ; switch-client -T move }
bind-key -T move Escape switch-client -T root

# tmux-dev: tmux 계층을 개발 계층에 대응시키는 확장 (~/.config/tmux/plugins/tmux-dev).
#   세션 = 디렉토리  prefix S   소문자 s(순정 세션 목록)의 "없으면 그 디렉토리에서 만들어 주는" 확장판
#   윈도우 = 워크트리 prefix W  소문자 w(순정 윈도우 트리)의 "없으면 브랜치의 워크트리를 만들어 주는" 확장판
#                              dir 모드(tab)는 저장소와 상관없이 아무 디렉토리의 윈도우를 연다
#   패널 = 역할               새 세션·윈도우의 패널 배치는 레이아웃이 정한다 (기본 plain: 셸 하나)
# tmux 의 세션·윈도우를 대체하지 않고 그 위에 얹는 관례다. prefix c 의 보통 윈도우, 저장소 아닌 세션은 그대로.
# tmux 에 플러그인 API 는 없다. 아래 run-shell 이 진입 스크립트를 한 번 돌리고, 그 스크립트가 bind-key 를
# 부른다 (TPM 도 결국 이 파일을 실행해 주는 설치기다). 키·팝업 크기·레이아웃은 @tmux-dev-* 사용자 옵션으로
# run-shell 줄보다 앞에서 바꾼다 (기본 S / W / 85%,75% / plain. 목록은 진입 스크립트 머리말). 셸에서는
# tmux-dev project|worktree (--help). 파일은 XDG 에: ~/.config/tmux-dev/ignore, ~/.local/state/tmux-dev,
# ~/.local/share/tmux-dev/worktrees.
run-shell ~/.config/tmux/plugins/tmux-dev/tmux-dev.tmux

# prefix a / M-a / M-A 는 agent-state 확장이 건다 (7번 섹션. 확장을 끄면 이 키들도 풀린다).

# tmux-fingers: 화면에 보이는 해시·경로·URL·IP·UUID·숫자 등에 글자 힌트를 붙이고, 그 글자를 누르면 복사한다.
#
#   prefix F   힌트 모드. 글자 = 복사, 대문자(Shift+글자) = 지금 패널에 붙여 넣기, Ctrl+글자 = 열기(open),
#              Tab = 여러 개 고르기, Space = fzf 로 고르기, ? = 도움말, q / Esc = 나가기
#   prefix J   점프 모드. 고른 자리로 복사 모드 커서를 옮긴다 (거기서 Space 로 선택을 시작)
#
# 왜: Claude Code·git·빌드 출력의 커밋 해시나 파일 경로를 집어 오려면 복사 모드에서 커서를 옮겨 선택해야 했다.
# 복사: tmux 버퍼(load-buffer -w)와 pbcopy 둘 다. -w 는 set-clipboard on 을 따라 OSC 52 로도 나가므로 pbcopy 가
#       없는 Linux 컨테이너에서도 로컬 클립보드에 닿는다. prefix ] / prefix = 로도 다시 붙여 넣을 수 있다.
# 설치: 플러그인 저장소 없이 실행 파일 하나만 chezmoi 가 받는다 (home/.chezmoiexternals/tmux-fingers.toml.tmpl).
#       저장소의 진입 스크립트(tmux-fingers.tmux)는 실행 파일을 찾아 아래 load-config 를 부르는 일이 전부다.
#       load-config 가 prefix F / J 와 fingers 키 테이블(힌트 모드 안의 키)을 bind-key 로 만든다.
#       바이너리가 없는 머신(Intel Mac, Linux arm64)에서는 파일이 없으므로 조용히 건너뛴다.
# -b: load-config 는 키 하나마다 tmux bind-key 를 따로 부른다(100번 남짓). 설정 읽기를 붙잡지 않게 뒤에서 돈다.
# TERM: tmux 가 run-shell 에 TERM=dumb 을 주는 환경(systemd 등)에서 힌트 색이 사라지는 문제를 진입 스크립트가
#       default-terminal 로 덮어 고친다(tmux-fingers #143). 같은 일을 여기서 한다.
# 옵션: @fingers-* 사용자 옵션을 이 줄보다 앞에 둔다 (키, 힌트 색, 패턴 추가 등. 목록은 저장소 README).
# 확인: prefix : → list-keys -T fingers 에 a~z 가 있으면 읽힌 것. 로그는 ~/.local/state/tmux-fingers/fingers.log,
#       load-config 가 읽어 둔 설정은 같은 디렉토리의 tmux-<서버 PID>/config.json.
if-shell '[ -x "$HOME/.local/bin/tmux-fingers" ]' \
    'run-shell -b "TERM=#{default-terminal} $HOME/.local/bin/tmux-fingers load-config"'

# tmux-fingers 우회: prefix J 가 고른 자리보다 한 줄 아래로 가는 문제.
#
# 증상: prefix J 로 힌트를 고르면 복사 모드 커서가 그 줄이 아니라 바로 아랫줄에 선다. 열(가로 위치)은 맞다.
#       prefix F(복사)는 줄 위치가 아니라 글자를 복사하므로 멀쩡하다.
# 원인: 세 가지가 겹친다.
#   1. fingers 는 "[fingers]" 라는 임시 윈도우를 만들고, 대상 패널과 자리를 맞바꿔(swap-pane) 그 위에 힌트를 그린다.
#   2. 화면에 ASCII 가 아닌 글자(한글, ❯, 프롬프트 기호 등)가 하나라도 있으면 임시 윈도우 높이를 대상 패널 높이에
#      맞춘다. 그런데 이 설정의 pane-border-status top(아래 "패널 테두리" 절) 때문에 패널이 하나뿐인 윈도우에도
#      위 테두리 한 줄이 생겨, 임시 윈도우 안의 패널은 한 줄 작아진다. 자리를 바꾼 대상 패널도 잠깐 그 크기로
#      줄어 맨 윗줄 하나가 스크롤백으로 밀려난다.
#   3. 점프(copy-mode → top-line → cursor-down N)는 대상 패널이 원래 자리로 돌아오기 전에 실행된다. 그때의 맨 윗줄은
#      원래 화면의 둘째 줄이라, N 줄 내려간 커서가 한 줄 아래에 선다.
#   업스트림 이슈 Morantron/tmux-fingers#142 ("Jump mode misses its targets", 원인 미확인으로 열려 있음)와 같은 증상이다.
# 우회: 새 윈도우가 생길 때마다(after-new-window 훅) 그 이름이 "[fingers]" 면 그 윈도우에서만 테두리를 끈다.
#       그러면 임시 윈도우의 패널이 대상과 같은 높이가 되어 줄이 어긋나지 않는다. 다른 윈도우의 테두리는 그대로다.
#       fingers 가 윈도우를 만드는 명령과 그다음 크기 맞추기는 서로 다른 tmux 명령이라, 훅이 그 사이에 먼저 끝난다.
# 훅 이란: tmux 안에서 어떤 일이 일어날 때마다 자동으로 도는 명령이다. after-new-window 는 new-window 가 끝날 때 돈다.
# 왜 [42]: 훅은 배열이라 칸(요소)마다 명령 하나를 담는다. 번호 없이 set-hook 하면 [0] 에 들어가 다른 설정이나
#       플러그인이 [0] 에 걸어 둔 훅을 덮어쓰고, -a(덧붙이기)로 걸면 설정을 다시 읽을 때마다 같은 명령이 쌓인다.
#       번호를 고정하면 다른 칸과 함께 돌고, 다시 읽어도 하나만 남는다. 칸은 채운 번호만 저장되므로(빈 0~41 은
#       메모리를 쓰지 않는다) 번호는 아무 큰 수면 된다. 다른 곳에서 after-new-window[42] 를 쓰지 않도록 한다.
#       확인: prefix : → show-hooks -g after-new-window
# 언제 지우나: 다음 중 하나가 되면 이 훅 블록(주석 포함)을 지워도 된다.
#   - pane-border-status 를 끄거나 bottom 으로 바꿀 때. bottom 도 한 줄을 먹으므로 그대로는 지우지 말고 아래 확인부터.
#   - tmux-fingers 를 더 이상 쓰지 않을 때 (home/.chezmoiexternals/tmux-fingers.toml.tmpl 을 지울 때).
#   - 업스트림이 고쳤을 때. tmux-fingers 버전을 올리면 아래로 확인한다.
#     1) prefix : → set-hook -gu 'after-new-window[42]'   (이 서버에서만 훅을 뗀다)
#     2) 한글이 섞인 화면(예: git log --oneline)에서 prefix J 로 중간쯤 줄의 힌트를 고른다
#     3) 커서가 고른 줄에 서면 고쳐진 것이니 블록을 지운다. 아랫줄에 서면 그대로 둔다.
#        떼어 낸 훅은 prefix : → source-file ~/.config/tmux/tmux.conf 로 다시 읽으면 돌아온다.
set-hook -g 'after-new-window[42]' \
    'if-shell -F "#{==:#{window_name},[fingers]}" "set-option -w pane-border-status off"'

# 프롬프트 단위 이동 (Ghostty 의 cmd+up/down jump_to_prompt 에 해당).
#
# 전제: 셸이 OSC 133 마크를 tmux 에 보내야 한다. tmux 가 띄운 zsh 는 rc.zsh 가
#       ~/.config/shell/terminal/tmux.zsh 를 소싱해 마크를 찍는다 (원리는 그 파일).
#       마크가 없으면 이 키들은 아무 일도 하지 않는다 (man tmux: previous-prompt).
# 키:   M-S-Up / M-S-Down = Option+Shift+↑/↓ (Ghostty macos-option-as-alt=left, iTerm2 Left Option=Esc+ 전제).
#       - copy-mode(emacs) 테이블의 기본값은 C-M-Up/Down 인데 macOS 에서 Ctrl+Option+↑/↓ 는
#         Rectangle 의 Top/Bottom Half, Ctrl+Option+Shift+↑ 는 Maximize Height 라 터미널에
#         닿기 전에 먹힌다. Ctrl+↓ / Ctrl+Shift+↓ 는 macOS Application windows 가 쓴다.
#       - cmd 조합은 macOS 터미널(Ghostty/iTerm2)이 pty 로 인코딩하지 않아 tmux 가 볼 수 없다.
#       - Option+↑/↓ 는 VS Code 의 "줄 이동" 관용 키라 터미널 프로그램도 흔히 쓴다 (lazygit 커밋 이동,
#         nano 스크롤, fish 토큰 검색, Helix 선택 확장, Zellij 패널 포커스). Shift 를 더한 Option+Shift+↑/↓ 는
#         그보다 훨씬 한산하고(micro 다중 커서, fzf-lua 미리보기 정도), macOS/Rectangle/Ghostty/iTerm2
#         어디서도 가로채지 않는다. iTerm2(cmd+shift+↑/↓)와 Ghostty(cmd+shift+↑/↓)의 마크 이동 키와
#         "shift+↑/↓" 꼴이 같아 짝도 맞는다. Ghostty 는 ESC [1;4A 로 보낸다
#         (확인: tmux 안 cat -v 에서 ^[[1;4A 또는 ^[^[[1;2A, 둘 다 M-S-Up).
#       - 우리는 mode-keys vi 라 vi 테이블에는 기본 바인딩이 없어 여기서 채운다.
#       - previous-prompt -o (프롬프트 줄 대신 출력 시작 줄로)는 프롬프트 이동과 한 줄 차이라 두지 않는다.
# 동작: previous-prompt 는 커서를 이전 프롬프트 줄로 옮기고 필요하면 스크롤한다.
#       next-prompt 로 지금 입력 중인 프롬프트까지 내려오면 copy-mode 를 자동 종료해서
#       Ghostty 처럼 "위로 올라갔다 그냥 돌아온" 느낌을 낸다. 조건은 "스크롤이 바닥이고
#       copy-mode 커서가 실제 커서 줄에 있다" 이다.
bind-key -T copy-mode-vi M-S-Up   send-keys -X previous-prompt
bind-key -T copy-mode-vi M-S-Down {
    send-keys -X next-prompt
    if-shell -F '#{&&:#{==:#{scroll_position},0},#{==:#{copy_cursor_y},#{cursor_y}}}' { send-keys -X cancel }
}

# root: copy-mode 밖에서도 Option+Shift+↑ 한 번으로 바로 이전 프롬프트로 간다.
#
# 왜 조건부인가: 패널 안 프로그램이 이 키를 쓸 수 있으므로(위의 micro, fzf-lua 류) root 바인딩이
#     가로채면 안 된다. "패널에서 프로그램이 돌고 있으면 키를 그대로 패널로 넘기고, 셸 프롬프트에
#     있을 때만 점프"한다.
#     - pane_command_running: OSC 133 C 가 나가고 D 가 아직 안 온 상태. 셸 통합이 있는 패널이면
#       lazygit, REPL, ssh(원격 셸 포함) 등 모든 실행 중 명령을 잡아낸다.
#     - alternate_on: 대체 화면을 쓰는 전체 화면 프로그램(nvim, less, htop). 셸 통합이 없는
#       패널(bash, zsh -f)을 위한 보조 조건이다.
#     tmux 기본 WheelUpPane 바인딩이 같은 꼴(#{||:#{alternate_on},...} 이면 send-keys -M)이다.
#     남는 구멍은 "통합 없는 셸에서 줄 모드 프로그램이 도는 중" 뿐이고, 그때는 copy-mode 에 들어가
#     M-S-Up 을 쓰면 된다. 프로그램이 이 키를 쓰는 중에 프롬프트로 가고 싶을 때도 같다 (prefix [).
bind-key -n M-S-Up if-shell -F '#{||:#{pane_command_running},#{alternate_on}}' \
    { send-keys M-S-Up } \
    { copy-mode ; send-keys -X previous-prompt }


# ==============================================================================
# 4. 상태바 레이아웃 (Status Bar)
# ==============================================================================

# ---- 확장 슬롯 ----
#
# 4~6번 섹션(상태바·탭·패널 테두리)은 그 자체로 완결된 "기본 층" 이고, 그 위에 덧붙는 것은 "확장" 이다.
# 기본 층은 확장의 이름을 모른다. 대신 확장이 채울 자리(슬롯)를 비워 두고, 포맷에서 그 자리를 펼친다.
# 슬롯이 비어 있으면 아무것도 그리지 않으므로, 확장을 하나도 읽지 않아도 상태바는 그대로 동작한다.
#
#   @slot_tab        탭 이름 뒤에 붙는 조각                    (윈도우마다 펼친다)
#   @slot_tab_alert  그 탭의 주의 단계: attn | err | 빈 값      (윈도우마다 펼친다)
#                    기본 층이 보고 있지 않은 탭의 바탕을 신호색으로 칠한다 (attn = @c_attn, err = @c_err).
#                    어떻게 칠할지는 기본 층이 정하고, 확장은 단계만 낸다. 값 하나짜리라 한 확장만 쓴다.
#   @slot_right      상태바 오른쪽, ☕ 와 시각 앞에 붙는 조각   (보고 있는 클라이언트 기준으로 펼친다)
#   @slot_pane       패널 테두리 제목 앞에 붙는 조각           (패널마다 펼친다)
#
# 확장이 지킬 것:
#   - 슬롯에는 자기 조각을 가리키는 "참조" 를 덧붙인다 (예: set -ga @slot_tab '#{E:@내_조각}'). 조각의 내용은 자기 옵션에 둔다.
#     끌 때는 자기 옵션만 비우면 된다. 참조는 빈 값으로 펼쳐져서 처음부터 없던 것과 같은 화면이 된다.
#   - 이 파일은 읽힐 때마다 아래에서 슬롯을 비우고 확장은 그 뒤(7번 섹션)에 읽히므로, 다시 읽어도(prefix R) 참조가 쌓이지 않는다.
#     확장 스크립트를 따로 다시 돌리는 경우를 위해, 이미 들어 있는 참조는 다시 넣지 않는다.
#   - 조각의 끝은 #[default] 로 스타일을 되돌린다. 탭 안에서는 그 탭의 스타일로 돌아간다.
# 기본 층이 확장에 알려 주는 것:
#   - 팔레트(2번 섹션의 @c_*). 확장은 있으면 그 색을 기본값으로 쓰고, 없으면 자기 값을 쓴다.
#   - @tab_filled (5번 섹션): 그 탭의 바탕이 밝은 색으로 칠해졌는가. 칠해진 탭에서는 조각에 색을 입히지 않아야 글자가 묻히지 않는다.
set -g @slot_tab       ""
set -g @slot_tab_alert ""
set -g @slot_right     ""
set -g @slot_pane      ""

# 상태바 갱신 주기(초). 기본값과 같은 15 지만, 아래 status-right 의 gitmux 가 이
# 주기마다 git 명령을 실행하므로 "낮추면 비용이 든다" 는 걸 기억하기 위해 명시한다.
set -g status-interval 15

# 상태바 전체의 기본 배경/전경 색과 윈도우 목록 정렬.
# #[default] 로 되돌아갈 때 적용되는 색이 이것이다. 색 이름(@c_*)은 2번 섹션의 팔레트.
# 바탕은 터미널 바탕 그대로 둔다(default). 예전 값 #1e1e2e 는 Ghostty 바탕 #1e1f29 와 한 끗 달라서, 같아 보이려던 것이
# 어긋나 있었다. default 면 터미널 테마를 바꿔도 따라간다.
set -g status-style "bg=default,fg=#{@c_text}"
set -g status-justify left

# [좌측] 세션 이름 뱃지. 뒤에 붙은 " " 하나는 #[default] 로 색을 되돌린 공백이라
# 뱃지와 윈도우 목록 사이에 상태바 배경색 간격이 생긴다.
#
# 뱃지 색으로 지금 어떤 키 테이블에 있는지 보여 준다.
#   평소(root)        라벤더  @c_accent
#   prefix 를 누름     복숭아  @c_mode    (C-b, C-a 둘 다 prefix 테이블로 들어간다)
#   그 밖의 테이블     초록    @c_green   + 테이블 이름 (예: prefix g 의 move 모드에서 " main move ")
# 왜: prefix 를 눌렀는지, move 모드에 아직 머물러 있는지 화면에서 알 수 없어 다음 키가 어디로 갈지 헷갈린다.
# client_key_table 은 prefix 일 때 "prefix", 평소 "root" 다. 테이블이 바뀌면 tmux 가 상태바를 바로 다시 그린다.
# 함정: #{client_prefix} 는 이름과 달리 "root 가 아닌 테이블에 있다" 는 뜻이라 move 모드에서도 1 이다.
#       그래서 prefix 와 move 를 가르려면 client_key_table 을 직접 비교한다.
# 색 고르기는 #{?조건,참,거짓} 중첩이다. #[bg=..,fg=..] 를 통째로 분기 안에 넣으면 그 쉼표가 분기 구분자로
# 읽히므로, 색 값만 고르는 @status_left_bg 를 따로 두고 #[bg=#{E:@status_left_bg}] 로 넣는다.
set -g @status_left_bg "#{?#{==:#{client_key_table},root},#{@c_accent},#{?#{==:#{client_key_table},prefix},#{@c_mode},#{@c_green}}}"
set -g @status_left_table "#{?#{m/r:^(root|prefix)$,#{client_key_table}},,#{client_key_table} }"
set -g status-left-length 40
set -g status-left "#[bg=#{E:@status_left_bg},fg=#{@c_ink},bold] #S #{E:@status_left_table}#[default] "

# 세션 이름 뱃지를 좌클릭하면 세션 목록(prefix s 와 같은 choose-tree -Zs)을 열고,
# 목록이 열려 있을 때 다시 누르면 닫는다 (토글). 우클릭은 tmux 기본값인 세션 메뉴
# (이름 바꾸기, 새 세션 등) 그대로다.
#
# 왜: "현재 위치의 이름을 누르면 다른 곳으로 전환" 은 VS Code 브랜치 표시나 Slack
#     워크스페이스 이름과 같은 익숙한 패턴이다. 좌클릭 = 전환, 우클릭 = 관리로 나뉜다.
#     status-left 에는 세션 이름만 있으므로 StatusLeft 영역 전체를 버튼으로 쓴다.
#     드롭다운처럼 같은 자리를 다시 눌러 닫을 수 있어야 자연스럽다.
#
# 열림 판별: choose-tree 는 패널을 tree-mode 로 바꾸므로 #{pane_mode} 로 알 수 있다.
# 닫기: tree-mode 의 기본 종료 키 q 를 보낸다. send-keys -X cancel 은 copy-mode
#       전용이라 tree-mode 에서는 "not in a mode" 로 실패한다.
bind-key -n MouseDown1StatusLeft \
  if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys q' 'choose-tree -Zs'

# [우측 ☕] 사람이 띄운 caffeinate(macOS 가 잠들지 않게 붙잡는 명령)가 있을 때만 시각 앞에 ☕ 를 띄운다.
#
# 왜: `caffeinate -di` 같은 것을 띄워 두고 잊으면 배터리가 닳고 디스플레이가 꺼지지 않는다. 켜져 있다는 것이
#     눈에 보여야 끈다.
# 판별: scripts/caffeinate-status 가 ps 한 번으로 caffeinate 와 그 부모를 보고 on / 빈 줄을 낸다.
#       Claude Code 가 띄운 것(세션마다 `caffeinate -i -t 300` 을 5분마다 갱신, bg-spare 데몬도)은 뺀다. 세면 늘
#       켜져 있어 아무 정보가 되지 않는다 (에이전트가 일하는 중인지는 이 표시의 몫이 아니다).
#       참고한 tmux-caffeinated 플러그인은 `pgrep -x caffeinate` 로 이름만 보므로 여기서는 늘 켜진다.
# 바꾸기: @caffeinate_ignore 에 무시할 부모 명령줄의 정규식(awk ERE, 쉼표 불가)을 넣는다. 비우면 기본(Claude),
#         none 이면 아무것도 빼지 않는다. 예: set -g @caffeinate_ignore none   (tmux.local.conf 에)
# 비용: #() 는 tmux 가 뒤에서 돌리고(상태바를 붙잡지 않음) 결과를 캐시해 status-interval(15초)마다 한 번만
#       다시 돌린다. 한 번에 50ms 남짓(macOS ps 가 대부분)이다. 위 gitmux 도 같은 주기로 git 을 부른다.
#       캐시는 클라이언트(붙어 있는 터미널)마다 따로라, 두 창에서 붙어 있으면 두 배로 돈다. 아무도 붙어 있지
#       않으면(detach) 상태바를 그리지 않으므로 돌지 않는다.
# 표시 끄기: @caffeinate_show 를 off 로. 꺼진 쪽 분기는 펼치지 않으므로 스크립트가 아예 불리지 않는다(실측 0번).
#       지금 서버에서 바로: tmux set -g @caffeinate_show off   (켜기: on). 늘 끄려면 tmux.local.conf 에 같은 줄.
# 모양: 에스프레소 바탕에 크림색 굵은 글자, 좌우에 라떼색 반칸 블록(▐ ▌)으로 테두리를 흉내 낸 커피 배색 알약.
#         … main | ▐ ☕ awake ▌ 09:30
#       ☕ 는 터미널 칸 크기(2칸)에 묶여 작아서, 바로 읽히도록 글자(@caffeinate_label)를 함께 둔다.
#       한 줄 상태바라 진짜 테두리는 그릴 수 없다. ▐ 는 칸의 오른쪽 절반, ▌ 는 왼쪽 절반을 채우는 글자라 알약에
#       붙은 두툼한 세로 테두리처럼 보인다 (Fira Code 에 있다. Nerd Font 불필요). tmux 는 둘 다 1칸으로 센다.
#       색·글자는 아래 @caffeinate_* 로 바꾼다. 알약을 @caffeinate_pill 로 따로 두고 #{E:…} 로 꺼내는 이유는,
#       #{?조건,참,거짓} 안에 #[bg=…,fg=…] 를 바로 쓰면 그 쉼표가 분기 구분자로 읽히기 때문이다.
# ☕ 는 tmux 가 2칸으로 센다(한글과 같다). Nerd Font 가 없어도 보이도록 그림 문자를 썼다.
set -g @caffeinate_show on
set -g @caffeinate_ignore ""
set -g @caffeinate_label "awake"
set -g @caffeinate_bg   "#3b2416"   # 에스프레소
set -g @caffeinate_fg   "#f3e5d0"   # 크레마
set -g @caffeinate_edge "#c69c72"   # 라떼 (좌우 테두리)
set -g @caffeinate_pill "#[default]#[fg=#{@caffeinate_edge}]▐#[bg=#{@caffeinate_bg},fg=#{@caffeinate_fg},bold] ☕ #{@caffeinate_label} #[default]#[fg=#{@caffeinate_edge}]▌#[default] "
set -g @caffeinate_status "#{?#{==:#{@caffeinate_show},off},,#{?#{==:#(~/.config/tmux/scripts/caffeinate-status '#{@caffeinate_ignore}' #{@caffeinate_rev}),on},#{E:@caffeinate_pill},}}"

# prefix A (Awake): Mac 이 잠들지 않게 붙잡는 caffeinate 를 켜고 끈다. 켜면 위 ☕ 가 바로 뜬다.
#
# 켜기는 `caffeinate <@caffeinate_flags> -w <tmux 서버 PID>` 를 띄운다. -w 때문에 tmux 서버가 끝나면 같이 끝나서,
# 켜 둔 채 잊어도 남지 않는다. 끄기는 이 키로 띄운 것만 끈다 (터미널에서 직접 띄운 것, Claude Code 의 것은 그대로).
# 동작은 scripts/caffeinate-toggle.
#
# 플래그 (기본 -i):
#   -i  시스템의 유휴 잠자기를 막는다. 디스플레이는 평소대로 꺼지고 화면도 잠기지만, 프로세스·네트워크·ssh 는
#       그대로 돈다. 긴 빌드나 Claude 작업을 걸어 두고 자리를 비울 때는 이것으로 충분하다.
#   -d  디스플레이가 꺼지는 것도 막는다. 화면을 보며 기다릴 때(로그 지켜보기, 발표)만 필요하다. 배터리를 더 쓴다.
#   예: set -g @caffeinate_flags "-di"   (tmux.local.conf 에)
# 막지 못하는 것: MacBook 덮개를 닫으면 -i 로는 잠든다. 직접 잠자기(메뉴 → 잠자기)도 막지 않는다.
# 키: A 는 순정과 이 설정 모두에서 비어 있다.
set -g @caffeinate_flags "-i"
bind-key A run-shell -b '~/.config/tmux/scripts/caffeinate-toggle "#{@caffeinate_flags}"'

# [우측] 현재 패널 디렉토리명(#{b:...} 는 basename) | gitmux 가 그린 git 상태 | 확장 조각 | ☕ | 시각.
# gitmux 가 설치되어 있어야 한다 (brew install gitmux). 설정은 gitmux.conf 참고.
# 확장 조각(@slot_right, 이 섹션 맨 위)은 확장이 채우는 자리이고, 확장이 없으면 빈 값이다.
# ☕ 는 이 파일이 직접 그리는 것이라 슬롯에 넣지 않고 그 뒤에 둔다 (슬롯에 넣으면 읽힌 순서대로 붙어 확장 조각보다 앞에 온다).
# 길이: 넘치면 tmux 가 status-right 를 잘라 낸다. 긴 디렉토리명(25칸 남짓) + gitmux 의 브랜치·변경 표시(40칸 남짓)
#       + 확장 조각(15칸 남짓) + caffeinate 알약(13칸) + 시각이 함께 들어가도록 115 로 둔다
#       (80 → 알약을 넣으며 100 → 확장 조각을 넣으며 115).
set -g status-right-length 115
set -g status-right '#[fg=colour14]#{b:pane_current_path} #(gitmux -cfg ~/.config/tmux/gitmux.conf "#{pane_current_path}") #[default]| #{E:@slot_right}#{E:@caffeinate_status}%H:%M '

# ---- 상태바를 2줄로 만들고 첫 줄을 비워 패널과 상태바 사이에 여백을 둔다 ----
#
# status 를 2 로 올리면 status-format[0] (기본: 세션/윈도우 목록 줄) 과
# status-format[1] (기본: 패널 목록 줄) 두 줄이 그려진다. 우리가 원하는 것은
# "빈 줄 + 기존 상태바" 이므로, [0] 의 기본 포맷을 [1] 로 옮기고 [0] 은 비운다.
#
# 기본 포맷 문자열이 매우 길어 복사해 두지 않고 실행 시점에 읽어 쓴다. 그런데
# 이 파일을 다시 source 하면 [0] 이 이미 비어 있어 빈 값을 [1] 로 옮기게 되므로,
# 최초 1회에 원본을 @orig_status_format_* 사용자 옵션에 백업해 두고 이후에는
# 그 백업을 쓴다. [1] 백업은 현재 쓰이지 않지만 원복용으로 함께 보관한다.
#
# show-options 의 -v 는 값만, -g 는 전역 옵션을 뜻한다.
set -g status 2
run-shell '
  orig0="$(tmux show-options -gv @orig_status_format_0 2>/dev/null)"
  orig1="$(tmux show-options -gv @orig_status_format_1 2>/dev/null)"

  if [ -z "$orig0" ]; then
    orig0="$(tmux show-options -gv "status-format[0]")"
    tmux set-option -g @orig_status_format_0 "$orig0"
  fi

  if [ -z "$orig1" ]; then
    orig1="$(tmux show-options -gv "status-format[1]")"
    tmux set-option -g @orig_status_format_1 "$orig1"
  fi

  tmux set-option -g status-format[0] ""
  tmux set-option -g status-format[1] "$orig0"
'


# ==============================================================================
# 5. 윈도우 탭 스타일 (Window Tab Styling)
# ==============================================================================
# 상태바의 윈도우 목록(탭)을 꾸민다. 색은 아래 @변수에 모아 두고 포맷에서는
# #{E:@변수} 로 꺼내 쓴다. E: 는 "값을 한 번 더 포맷으로 확장" 하라는 뜻으로,
# 사용자 옵션 안의 #[...] 나 #{...} 가 실제로 해석되게 한다.

# 색상 정의. 여기만 고치면 전체 탭에 반영된다. 값은 2번 섹션의 팔레트에서 꺼낸다
# (#{E:@tab_bg} 가 이 값을 다시 포맷으로 펼치므로 안의 #{@c_surface} 도 색 값이 된다).
set -g @tab_bg            "#{@c_surface}"   # 비활성 탭 배경
set -g @tab_fg            "#{@c_sub}"       # 비활성 탭 글자
set -g @tab_curr_bg       "colour68"        # 현재 탭 배경
set -g @tab_curr_fg       "#{@c_ink}"       # 현재 탭 글자
set -g @tab_sep_fg        "#{@c_line}"      # 탭 사이 구분선
set -g @win_flag_curr_fg  "colour195" # 현재 탭의 플래그(#F) 색
set -g @win_flag_fg       "colour251" # 비활성 탭의 플래그 색

# 기본 스타일. *-style 은 바탕 스타일, *-format 은 내용이며 포맷 안의 #[default] 는
# 이 *-style 로 되돌아간다는 뜻이다.
# 비활성 탭의 바탕은 확장이 올린 주의 단계(@slot_tab_alert, 4번 섹션의 확장 슬롯)가 attn 이면 @c_attn, err 이면 @c_err,
# 아니면 원래 색. 분기 안의 쉼표는 #, 로 쓴다 (조건 구분자와 겹쳐서).
# 현재 탭은 아래 current-style 이라 칠하지 않는다. 그래서 알림이 있어도 "지금 여기" 의 색은 늘 같다.
set -g window-status-style         "#{?#{==:#{E:@slot_tab_alert},attn},fg=#{@c_ink}#,bg=#{@c_attn}#,bold,#{?#{==:#{E:@slot_tab_alert},err},fg=#{@c_ink}#,bg=#{@c_err}#,bold,fg=#{E:@tab_fg}#,bg=#{E:@tab_bg}}}"
set -g window-status-current-style "fg=#{E:@tab_curr_fg},bg=#{E:@tab_curr_bg},bold"

# 확장이 물어보는 것: 이 탭의 바탕이 밝은 색으로 칠해졌는가 (벨 탭, 또는 주의가 올라온 비활성 탭).
# 칠해진 탭에서는 조각에 색을 입히지 않아야 한다. 신호색 아이콘이 같은 색 바탕에 묻히기 때문이다.
set -g @tab_filled "#{||:#{window_bell_flag},#{&&:#{!=:#{E:@slot_tab_alert},},#{!=:#{window_active},1}}}"

# 벨이 울린 윈도우(! 플래그)의 탭. 기본값 reverse 는 위 탭 색을 뒤집어 눈에 잘 안 띄므로 노란 바탕으로 칠한다.
# 그 윈도우로 가면 플래그와 함께 저절로 꺼진다. 벨을 울리는 쪽은 1번 섹션의 bell-action 설명 참고.
set -g window-status-bell-style "fg=#{@c_ink},bg=#{@c_yellow},bold"

# 탭 구분선. 마지막 탭(window_end_flag)이 아닐 때만 탭 배경색 위에 세로선을 그린다.
# window-status-separator 를 쓰지 않고 포맷 끝에 직접 붙이는 이유는, 구분선 색을
# 탭 배경과 맞추고 마지막 탭 뒤에는 그리지 않기 위해서다.
set -g @tab_sep "#{?window_end_flag,,#[none]#[fg=#{E:@tab_sep_fg}]#[bg=#{E:@tab_bg}]│}"

# 윈도우 플래그(#F). 활동(#), 벨(!), 마지막 윈도우(-), 현재(*) 등을 표시하며
# 플래그가 있을 때만 공백과 함께 색을 입혀 붙인다.
set -g @win_flag_curr "#{?window_flags, #[fg=#{E:@win_flag_curr_fg}]#F,}"
# 비활성 탭이 주의 단계로 칠해졌으면(@slot_tab_alert) 밝은 플래그 색이 신호색 바탕에 묻히므로 탭 글자색 그대로 둔다.
set -g @win_flag      "#{?window_flags, #{?#{E:@slot_tab_alert},,#[fg=#{E:@win_flag_fg}]}#F,}"

# 최종 포맷: " 번호:이름[확장 조각][플래그] │". 기본 구분선은 비우고 @tab_sep 로 대체한다.
# @slot_tab 은 확장이 채우는 자리다 (4번 섹션의 확장 슬롯). 확장이 없으면 빈 값이다.
set -g window-status-separator ""
set -g window-status-format         " #I:#W#{E:@slot_tab}#{E:@win_flag} #{E:@tab_sep}"
set -g window-status-current-format " #I:#W#{E:@slot_tab}#{E:@win_flag_curr} #{E:@tab_sep}"


# ==============================================================================
# 6. 패널 테두리 (Pane Border)
# ==============================================================================

# 각 패널 상단 테두리에 정보 줄을 표시한다 (기본값 off).
# 분할이 많아지면 어느 패널이 어디서 무엇을 돌리고 있는지 한눈에 보기 위함이다.
set -g pane-border-status top

# 테두리 색. 비활성은 은은한 회색, 활성은 굵은 하늘색으로 현재 패널을 드러낸다.
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=#00afff,bold"

# 테두리 정보 줄 포맷: "[확장 조각] [패널 번호] 현재 경로 | 실행 중인 명령".
# 활성 패널은 밝은 색 + 굵게 + 밑줄, 비활성은 회색으로 구분한다.
# 경로는 홈 디렉토리를 ~ 로 줄인다. #{s|패턴|바꿀 글자|:변수} 는 치환이고, $HOME 은 이 파일을 읽을 때 값으로 바뀐다
# (큰따옴표 안이라서. 문자열 중간의 ~ 는 펼쳐지지 않고 글자 그대로 남는다).
# @slot_pane 은 확장이 채우는 자리다 (4번 섹션의 확장 슬롯). 패널마다 펼치므로 그 패널에 대한 것을 보여 줄 수 있다.
# 맨 앞에 두는 이유: 조각 끝의 #[default] 가 스타일을 되돌리므로, 활성 패널 스타일은 그 뒤에서 다시 입힌다.
set -g pane-border-format " #{E:@slot_pane}#{?pane_active,#[fg=colour14]#[bold]#[underscore],#[fg=colour8]}[#P] #{s|^$HOME|~|:pane_current_path} | #{pane_current_command} "


# ==============================================================================
# 7. 외부 설정과 확장 로드 (OS Specific, Local Overrides & Extensions)
# ==============================================================================

# OS 별 설정과 머신 로컬 설정을 읽어 위 내용을 덮어쓸 수 있게 한다.
# -q 는 파일이 없어도 오류를 내지 않는 옵션이다. 현재는 세 파일 모두 존재하지 않는다.
source-file -q ~/.config/tmux/tmux.darwin.conf
source-file -q ~/.config/tmux/tmux.linux.conf
source-file -q ~/.config/tmux/tmux.local.conf

# ---- 확장 ----
#
# 기본 층(4~6번 섹션) 위에 덧붙는 것들. 여기부터 아래를 지워도 상태바·탭·패널 테두리는 그대로 동작한다.
# 로컬 설정보다 뒤에 읽는 이유: 확장은 읽히는 순간의 옵션(@agent-state-* 등)을 보고 조각과 키를 만든다. 그래서
#     tmux.local.conf 에 적은 스위치·색·키가 처음 읽을 때부터 먹는다 (먼저 읽으면 두 번째로 읽을 때에야 먹는다).
#
# agent-state: 패널 안 코딩 에이전트(Claude Code)의 상태를 탭·상태바·패널 테두리에 보여 준다 (~/.config/tmux/plugins/agent-state).
#   탭       그 윈도우의 패널 중 가장 급한 상태: ◆ 나를 기다림(허락·질문) > ✘ 오류 > ✔ 끝남 > ⋯ 작업 중. ◆2 = 둘이 기다림.
#            대기·오류가 있는 탭은 바탕 전체를 노랑·빨강으로 칠한다 (지금 보고 있는 탭은 원래 색 그대로)
#   상태바   오른쪽 끝 앞에 모든 세션을 통틀어 상태별 개수 (◆2 ✘1 ✔1 ⋯3). 다른 세션의 에이전트도 여기서 보인다
#   테두리   그 패널의 상태
#   (4번 섹션의 확장 슬롯 @slot_tab, @slot_tab_alert, @slot_right, @slot_pane 에 자기 조각을 등록한다)
#   prefix a     에이전트가 있는 패널만 모은 트리(choose-tree)를 띄운다. 줄마다 상태·이유·경로, 아래에 미리보기, Enter 로 이동
#   prefix M-a   나를 기다리는 다음 패널로 바로 가기 (대기 → 오류 → 끝남, 오래된 것부터. 다른 세션이어도)
#   prefix M-A   지금 패널의 표시 지우기 (Esc 로 거절하거나 중단하면 Claude Code 가 훅을 부르지 않아 표시가 남는다)
#   prefix C-a 는 그대로 "C-a 글자를 패널로 보내기" 다 (3번 섹션의 prefix2 설명).
# ✔ 는 다른 데서 그 패널로 들어오면 지워지고, ◆ 는 Claude 가 다음 일을 시작해야 지워진다. 허락 창에서 승인한 순간에는
# Claude Code 가 훅을 부르지 않아서, 승인한 명령이 오래 돌면 그 명령이 끝날 때까지 ◆ 가 남는다 (docs/agent-state.md "알려진 공백").
# 왜: Claude 를 여러 윈도우·패널에 띄워 두면 어느 것이 끝났고 어느 것이 나를 기다리는지 돌아다니며 봐야 했다.
#     예전에는 끝날 때 벨을 울렸지만 일반 프로그램의 벨과 구분되지 않았고, 보고 있는 윈도우에는 표시가 남지 않았다.
# 구조: 상태를 쓰는 쪽은 Claude Code 플러그인 agent-state(claude-plugins/agent-state)이고 패널 사용자 옵션 @agent_state 등에
#       쓴다. 이 어댑터는 읽어서 그리기만 한다. 플러그인이 없는 머신에서는 옵션이 비어 아무것도 그리지 않는다.
#       아이콘·색·키는 run-shell 줄보다 앞에서 @agent-state-* 로 바꾼다 (목록은 진입 스크립트 머리말). 설계: docs/agent-state.md
# 끄기: 지금 서버에서   ~/.config/tmux/plugins/agent-state/agent-state.tmux off   (조각을 비우고 키·훅을 푼다. 켜기는 on)
#       스위치(@agent-state-enable)를 적어 두므로 이 파일을 다시 읽어도(prefix R) 꺼진 채로 남는다. 서버를 새로 띄우면 다시 켜진다.
#       이 머신에서 늘 끄려면 tmux.local.conf 에  set -g @agent-state-enable off
run-shell ~/.config/tmux/plugins/agent-state/agent-state.tmux
