# .chezmoiscripts/run_onchange_before_10-install-packages-*.sh.tmpl 에서 읽는 설치 목록.
# 목록이 바뀌면 스크립트 내용도 바뀌므로, 다음 chezmoi apply 때 설치 스크립트가 다시 실행된다.
#
# 두 층으로 나뉜다. 설계는 docs/machines.md.
#   필수  packages.<os>.brews / casks / tools   그 OS 의 모든 머신에 설치
#   기능  packages.features.<이름>              이 머신에서 그 기능이 켜졌을 때만 (아래 features 머리말)
#
# 필수에는 터미널 작업에 늘 쓰는 것만 둔다 (OS·프로젝트와 상관없이).
# sudo 없는 임시 서버에는 이 목록이 아니라 저장소 루트 jw-ephemeral 의 목록으로 사용자 영역에 설치한다.
packages:
  darwin:
    # brew bundle 로 설치한다. 이미 설치된 formula 의 버전 업그레이드는 하지 않는다.
    brews:
      - chezmoi
      - bash
      - git
      - jq
      - ripgrep
      - fzf
      - fd
      - neovim
      - mise
      - coreutils
      # envsubst (dot_jongwan/bin/doco 가 쓴다)
      - gettext
      - tmux
      # tmux 상태바의 git 상태 표시 (tmux.conf 의 status-right 가 호출)
      - gitmux
      # 구문 단위 diff (dot_config/git/config.darwin 의 diff.external)
      - difftastic
    # brew install --cask 로 설치하는 GUI 앱과 폰트
    casks:
      - ghostty
      # ghostty 의 한글 fallback 폰트 (config.ghostty 의 font-family)
      - font-d2coding
  linux:
    # 도구 이름(= canonical 실행파일 이름). 패키지/실행파일 이름이 다른 경우는
    # 설치 스크립트 안의 default_pkg/pkg_override/bin_override 테이블에 등록한다.
    tools:
      - tmux
      # tmux-sessionizer(prefix S)와 셸 Ctrl-R/Ctrl-T 가 쓴다. macOS 는 brews 에 있다.
      - fzf
      - rg
      - fd
      - jq
      - gettext
      - bash-completion
      # fasd 를 소스에서 빌드(make install)할 때 필요
      - make

  # 기능: 머신마다 켜고 끄는 묶음. 기능 하나 = 패키지 + 그 전용 설정 파일 + 후처리.
  # 새 기능은 여기에 블록 하나를 더하면 된다 (설치 스크립트와 .chezmoiignore 는 이 목록을 돈다).
  #
  #   tier    이 기능의 기본값
  #             full    minimal 이 아닌 머신에서 켠다
  #             opt-in  켠다고 적은 머신에서만 켠다
  #   ignore  기능이 꺼진 머신에는 배포하지 않을 경로 (홈 기준, .chezmoiignore 문법)
  #   darwin  brews / casks 목록        linux  tools 목록
  #
  # 이 머신에서 켜졌는지는 .chezmoitemplates/enabled-features 가 정한다:
  #   머신의 ~/.config/chezmoi/chezmoi.toml 의 [data.features] 에 <이름> = true/false 가 있으면 그 값,
  #   없으면 tier 와 그 머신의 data.minimal 로 정한 기본값.
  # 그래서 머신에는 기본값과 다른 것만 적는다 (chezmoi edit-config). 기능을 꺼도 이미 설치된 것은 지우지 않는다
  # (관리만 멈춘다). 지금 켜진 목록: chezmoi execute-template '{{ includeTemplate "enabled-features" . }}'
  features:
    # 키 리매퍼 (macOS). 한글 입력 상태에서 tmux prefix/Esc 를 누르면 영문으로 바꾼다 (dot_config/private_karabiner/private_karabiner.json).
    # 설치 후 System Settings 에서 백그라운드 항목·드라이버 확장·손쉬운 사용 권한을 한 번 승인해야 동작한다.
    # 가상 HID 드라이버 확장을 설치하므로 보안 소프트웨어가 관리하는 머신에서는 깔면 안 된다. 그래서 opt-in 이고,
    # .chezmoi.toml.tmpl 이 init 때 물어서 답을 머신에 적는다.
    karabiner:
      tier: opt-in
      ignore:
        - .config/karabiner
      darwin:
        casks:
          - karabiner-elements
    # nvim IDE 모드(LazyVim)와 그 빌드·변환 도구. 꺼진 머신은 플러그인 없는 ~/.config/nvim-lite 만 쓴다
    ide:
      tier: full
      ignore:
        - .config/nvim
      darwin:
        brews:
          # nvim-treesitter 가 파서를 빌드할 때 쓴다
          - tree-sitter-cli
          - cmake
          # nvim snacks.image 가 SVG 등을 PNG 로 바꿀 때 쓴다 (dot_config/nvim/lua/plugins/svg-preview.lua)
          - imagemagick
      linux:
        tools:
          - tree-sitter-cli
    # 언어 런타임. 패키지 묶음은 없고, run_onchange_after_20-install-mise-tools 가 이 기능이 켜졌는지 보고
    # mise install 로 dot_config/mise/conf.d/shared.toml 의 node·python 등을 설치한다
    dev:
      tier: full
    # 로그인이 필요한 도구. 회사 머신에서도 회사 계정으로 쓴다. 로그인하지 않는 임시 머신(minimal)에서만 꺼진다
    credentials:
      tier: full
      darwin:
        brews:
          # GitHub CLI. jw 플러그인의 pr-review-fetch 가 쓴다 (설치 후 gh auth login 한 번)
          - gh
      linux:
        tools:
          - gh
