# .chezmoiscripts 의 설치 스크립트(10-install-packages-darwin, 10-install-packages-linux)가 읽는 설치 목록.
# 목록이 바뀌면 스크립트 내용도 바뀌므로, 다음 chezmoi apply 때 설치 스크립트가 다시 실행된다.
#
# 두 층으로 나뉜다. 설계는 docs/machines.md.
#   필수  packages.<os>.brews / casks / tools / pkgs   그 OS 의 모든 머신에 설치
#   기능  packages.features.<이름>                     이 머신에서 그 기능이 켜졌을 때만 (아래 features 머리말)
#
# 필수에는 터미널 작업에 늘 쓰는 것만 둔다 (OS·프로젝트와 상관없이).
# sudo 없는 임시 서버(저장소 루트의 jw-ephemeral)도 packages.linux.tools 를 읽어 같은 도구를 받는다.
packages:
  darwin:
    # brew bundle 로 설치한다. 이미 설치된 formula 의 버전 업그레이드는 하지 않는다.
    brews:
      - chezmoi
      - bash
      - git
      - jq
      - ripgrep
      - fzf
      - fd
      # 자주 간 디렉터리로 건너뛰기 (shell/rc.d/zoxide.sh)
      - zoxide
      - neovim
      - mise
      - coreutils
      # envsubst (dot_jongwan/bin/doco 가 쓴다)
      - gettext
      - tmux
      # tmux 상태바의 git 상태 표시 (tmux.conf 의 status-right 가 호출)
      - gitmux
      # 구문 단위 diff (dot_config/git/config.darwin 의 diff.external)
      - difftastic
      # 프로세스·자원 모니터. htop 은 프로세스를 다룰 때(정렬·kill·트리), btop 은 시스템 전체를 그래프로 볼 때
      # (tmux prefix b 가 floating pane 으로 띄운다)
      - htop
      - btop
    # brew install --cask 로 설치하는 GUI 앱과 폰트
    casks:
      - ghostty
      # ghostty 의 한글 fallback 폰트 (config.ghostty 의 font-family)
      - font-d2coding
  linux:
    # 미리 빌드된 바이너리를 mise 로 ~/.local 에 받는 도구 (sudo 가 필요 없다. 배포판과 상관없이 같은 최신 버전).
    #   bin   실행 파일 이름. ~/.local/bin/<bin> 으로 링크된다
    #   mise  mise 도구 이름 (mise registry 로 찾는다). 생략하면 bin 과 같다
    #   pkg   받은 바이너리가 이 시스템에서 실행되지 않을 때(Alpine 의 musl, 오래된 glibc) 대신 패키지 매니저로
    #         깔 패키지 이름. 생략하면 bin 과 같다
    #   compat  (선택) 최신 바이너리가 실행되지 않을 때 pkg 보다 먼저 받아 볼 버전. 최신 릴리스가 새 glibc 를
    #         요구하는 도구에만 적는다
    tools:
      - bin: tmux
        mise: aqua:tmux/tmux-builds
      # tmux-sessionizer(prefix S)와 셸 Ctrl-R/Ctrl-T 가 쓴다
      - bin: fzf
      - bin: rg
        mise: ripgrep
        pkg: ripgrep
      - bin: fd
      - bin: jq
      # 자주 간 디렉터리로 건너뛰기 (shell/rc.d/zoxide.sh)
      - bin: zoxide
      # neovim 은 mise 의 기본 백엔드(vfox)가 아니라 aqua 로 받는다 (GitHub 릴리스의 바이너리)
      - bin: nvim
        mise: aqua:neovim/neovim
        pkg: neovim
      # 자원 모니터 (tmux prefix b). 릴리스의 정적 musl 바이너리라 배포판과 상관없이 실행된다.
      # 이 빌드는 GPU 지원 없이 컴파일돼 GPU 패널은 없다 (1.4.8 의 btop --version 으로 확인, 2026-11-26)
      - bin: btop
    # 받을 바이너리가 없어 패키지 매니저로만 깔 수 있는 것. root 이거나 sudo 를 쓸 수 있을 때만 깐다.
    # 이름은 apt 기준이다. 다른 배포판에서 이름이 다르면 그 패키지는 건너뛴다.
    pkgs:
      # Alpine 처럼 bash 가 없는 이미지를 위해. 이 저장소의 셸 설정은 bash 나 zsh 를 전제로 한다
      - bash
      - bash-completion
      # envsubst (dot_jongwan/bin/doco 가 쓴다)
      - gettext
      # 프로세스 모니터. 미리 빌드된 바이너리를 내지 않아 패키지 매니저로 깐다
      - htop

  # 기능: 머신마다 켜고 끄는 묶음. 기능 하나 = 패키지 + 그 전용 설정 파일 + 후처리.
  # 새 기능은 여기에 블록 하나를 더하면 된다 (설치 스크립트와 .chezmoiignore 는 이 목록을 돈다).
  #
  #   tier    이 기능의 기본값
  #             full    minimal 이 아닌 머신에서 켠다
  #             opt-in  켠다고 적은 머신에서만 켠다
  #   ignore  기능이 꺼진 머신에는 배포하지 않을 경로 (홈 기준, .chezmoiignore 문법)
  #   darwin  brews / casks 목록        linux  tools / pkgs 목록 (위 packages.linux 와 같은 꼴)
  #
  # 이 머신에서 켜졌는지는 .chezmoitemplates/enabled-features 가 정한다:
  #   머신의 ~/.config/chezmoi/chezmoi.toml 의 [data.features] 에 <이름> = true/false 가 있으면 그 값,
  #   없으면 tier 와 그 머신의 data.minimal 로 정한 기본값.
  # 그래서 머신에는 기본값과 다른 것만 적는다 (chezmoi edit-config). 기능을 꺼도 이미 설치된 것은 지우지 않는다
  # (관리만 멈춘다). 지금 켜진 목록: chezmoi execute-template '{{ includeTemplate "enabled-features" . }}'
  features:
    # 키 리매퍼 (macOS). 한글 입력 상태에서 tmux prefix/Esc 를 누르면 영문으로 바꾼다 (dot_config/private_karabiner/private_karabiner.json).
    # 설치 후 System Settings 에서 백그라운드 항목·드라이버 확장·손쉬운 사용 권한을 한 번 승인해야 동작한다.
    # 가상 HID 드라이버 확장을 설치하므로 보안 소프트웨어가 관리하는 머신에서는 깔면 안 된다. 그래서 opt-in 이고,
    # .chezmoi.toml.tmpl 이 init 때 물어서 답을 머신에 적는다.
    karabiner:
      tier: opt-in
      ignore:
        - .config/karabiner
      darwin:
        casks:
          - karabiner-elements
    # nvim IDE 모드(LazyVim)와 그 빌드·변환 도구. 꺼진 머신은 플러그인 없는 ~/.config/nvim-lite 만 쓴다
    ide:
      tier: full
      ignore:
        - .config/nvim
      darwin:
        brews:
          # nvim-treesitter 가 파서를 빌드할 때 쓴다
          - tree-sitter-cli
          - cmake
          # nvim snacks.image 가 SVG 등을 PNG 로 바꿀 때 쓴다 (dot_config/nvim/lua/plugins/svg-preview.lua)
          - imagemagick
      linux:
        tools:
          - bin: tree-sitter
            pkg: tree-sitter-cli
            # 0.26 부터의 바이너리는 glibc 2.39 이상이 필요하다 (Debian 12 는 2.36, Ubuntu 22.04 는 2.35).
            # 0.25.10 은 거기서도 실행되고 nvim-treesitter 가 이것으로 파서를 빌드한다 (2026-11-15 확인)
            compat: 0.25.10
        pkgs:
          # nvim-treesitter 가 파서를 빌드할 때 C 컴파일러와 libc 헤더를 쓴다
          - gcc
          - libc6-dev
    # 언어 런타임. 패키지 묶음은 없고, run_onchange_after_20-install-mise-tools 가 이 기능이 켜졌는지 보고
    # mise install 로 dot_config/mise/conf.d/shared.toml 의 node·python 등을 설치한다
    dev:
      tier: full
    # 로그인이 필요한 도구. 회사 머신에서도 회사 계정으로 쓴다. 로그인하지 않는 임시 머신(minimal)에서만 꺼진다
    credentials:
      tier: full
      darwin:
        brews:
          # GitHub CLI. jw 플러그인의 pr-review-fetch 가 쓴다 (설치 후 gh auth login 한 번)
          - gh
      linux:
        tools:
          - bin: gh
