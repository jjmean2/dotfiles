# 저장소 밖에서 받아 오는 파일. chezmoi apply 가 URL 에서 받아 대상 경로에 둔다.
# 받은 것은 chezmoi 캐시(~/.cache/chezmoi)에 남아서 다음 apply 부터는 네트워크를 쓰지 않는다.
# 처음에 받지 못하면(네트워크, 차단된 주소) apply 전체가 멈춘다. 그때는 `chezmoi apply --exclude=externals` 로
# 나머지를 먼저 적용할 수 있다.
#
# zsh 플러그인 (shell/plugins.zsh 가 이 순서와 설정으로 읽는다. 더하고 올리고 빼는 법은 docs/zsh-plugins.md).
# 플러그인 관리자 없이 태그의 소스 묶음을 그대로 받아 ~/.local/share/zsh/plugins/<이름> 에 푼다.
# 버전을 올리려면 url 의 태그와 checksum 을 같이 바꾼다. exact 라서 새 버전에 없는 옛 파일은 지워진다.
[".local/share/zsh/plugins/fzf-tab"]
    type = "archive"
    url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/v1.3.0.tar.gz"
    checksum.sha256 = "d75ac08c2c8af5a6a0478787b0f11fabbe24951973b7841ae963431e2070ee9a"
    stripComponents = 1
    exact = true
[".local/share/zsh/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v0.7.1.tar.gz"
    checksum.sha256 = "0df7affff21cd87ed298e6a3970ed08a1dd66a6efa676454ee5b091ad503badf"
    stripComponents = 1
    exact = true
[".local/share/zsh/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/0.8.0.tar.gz"
    checksum.sha256 = "5981c19ebaab027e356fe1ee5284f7a021b89d4405cc53dc84b476c3aee9cc32"
    stripComponents = 1
    exact = true

# fzf-git.sh: Ctrl-G 다음 키로 git 브랜치·커밋·파일 … 을 fzf 로 골라 입력 줄에 넣는다 (shell/rc.d/fzf-git.sh 가 읽는다).
# 파일 하나짜리 스크립트이고 bash·zsh 둘 다 쓰므로 zsh 플러그인 자리가 아니라 따로 둔다.
# 저장소에 태그가 없어서 커밋으로 고정한다. 올리려면 url 의 커밋과 checksum 을 같이 바꾼다:
#   curl -fsSL https://raw.githubusercontent.com/junegunn/fzf-git.sh/<커밋>/fzf-git.sh | shasum -a 256
[".local/share/fzf-git/fzf-git.sh"]
    type = "file"
    url = "https://raw.githubusercontent.com/junegunn/fzf-git.sh/57ef995e245923ae05721e876c42100a1896ad6c/fzf-git.sh"
    checksum.sha256 = "a2b1502d169fefca863b51c419bfdc8d45683a8815b2c3fa1885ace0a2e173be"
