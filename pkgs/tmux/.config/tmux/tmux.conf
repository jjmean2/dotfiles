# mouse 휠 스크롤 등의 조작이 동작하도록
set-option -g mouse on

# 복사모드에서 vi 바인딩을 쓰도록 (emacs, vi 가능)
# EDITOR=vim 등의 환경변수가 있으면 기본값이 vi가 되고, 그 외에는 기본값이 emacs인 듯
set-window-option -g mode-keys vi

# 명령줄에서 emacs 바인딩을 쓰도록 (emacs, vi 가능)
# EDITOR=vim 등의 환경변수가 있으면 기본값이 vi가 되고, 그 외에는 기본값이 emacs인 듯
set-option -g status-keys emacs

# 새 창을 열 때, 현재 디렉토리에서 시작하기
bind-key -T prefix c new-window -c "#{pane_current_path}"
bind-key -T prefix '"' split-window -c "#{pane_current_path}"
bind-key -T prefix % split-window -h -c "#{pane_current_path}"

# scrollback buffer를 늘리기
set-option -g history-limit 5000


# 터미널 색상 적용 TrueColor 활성화
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# 상태바 스타일

# 상태바 갱신 주기
set -g status-interval 15   # 2초마다 갱신

# 상태바 전체 기본 배경/글자색
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify left

# status-left (왼쪽 세션 표시 영역)
set -g status-left-length 40
# [왼쪽] 세션명 강조
# set -g status-left-style "bg=#b4befe,fg=#181825,bold"
set -g status-left "#[bg=#b4befe,fg=#181825,bold] #S #[default] "

set -g status-right-length 80 
# set -g status-right '#[fg=colour89]#{pane_current_path} #[fg=colour14](#(gitmux -cfg ~/.config/tmux/gitmux.conf "#{pane_current_path}")#[fg=colour14]) #[default]| %H:%M '
set -g status-right '#[fg=colour14]#{b:pane_current_path} #[fg=colour14](#(gitmux -cfg ~/.config/tmux/gitmux.conf "#{pane_current_path}")#[fg=colour14]) #[default]| %H:%M '

# 윈도우 스타일

# 탭간 구분기호
set -g window-status-separator ""
# 1. 비활성 탭 (Inactive Windows) 스타일
# *-style은 *-format 의 기본 스타일을 지정한다.
# *-format 안에 스타일 서식을 넣으면 부분 서식을 지정할 수 있다. #[default]는 *-style에 지정한 기본 서식으로 돌린다.
set -g window-status-style "fg=#a6adc8,bg=#313244"
# #F는 Window Flags 로 현재 윈도우 상태에 따라 *, -, # 등 값이 출력된다.
set -g window-status-format " #I:#W (#F) "

# 2. 활성 탭 (Active Window - 현재 보고 있는 창) 스타일
#    배경색을 눈에 띄게 바꾸고 굵은 글씨 적용
# [가운데] 탭 디자인
set -g window-status-current-style "fg=#11111b,bg=colour68,bold"
set -g window-status-current-format " #I:#W (#F) "

# Pane border 스타일

# 각 Pane 상단 테두리에 상태 표시줄 활성화
set -g pane-border-status top 
# 비활성 Pane (은은한 회색)
set -g pane-border-style "fg=colour238"
# 활성 Pane (선명한 하늘색 + 굵게)
set -g pane-active-border-style "fg=#00afff,bold"
# 테두리에 표시할 포맷 지정 (Active Pane일 때 스타일 강조 가능)
# 예: [Pane 번호] 현재경로 | 실행 중인 커맨드
set -g pane-border-format " #{?pane_active,#[fg=colour14]#[bold]#[underscore],#[fg=colour8]}[#P] #{pane_current_path} | #{pane_current_command} "


# === OS 전용 설정과 로컬 오버라이드 로드 ===
# -q 를 주면 파일이 없어도 에러 없이 조용히 넘어간다. jw-stow 가 설치 시점에 반대
# 플랫폼 파일은 아예 심링크하지 않으므로, 실제로는 darwin/linux 중 하나만 존재한다.
source-file -q ~/.tmux.conf.darwin
source-file -q ~/.tmux.conf.linux
source-file -q ~/.tmux.conf.local
