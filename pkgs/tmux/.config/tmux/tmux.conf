# ==============================================================================
# 1. 기본 환경 및 입력 설정 (General & Input Settings)
# ==============================================================================

# 마우스 조작 활성화 (스크롤, 패널 선택/크기 조절 등)
set-option -g mouse on

# mode-keys와 status-keys는 기본값이 emacs인데 EDITOR=vim 환경변수가 있으면
# 기본값이 vi가 되는 듯함. 명시적으로 설정함

# 복사 모드 vi 바인딩 사용 (기본값: emacs)
set-window-option -g mode-keys vi

# 명령줄 프롬프트 emacs 바인딩 사용 (기본값: emacs)
set-option -g status-keys emacs

# 스크롤백 버퍼 크기 증가 (기본값: 2000)
set-option -g history-limit 10000

# TrueColor 터미널 색상 활성화
set -g default-terminal "tmux-256color"
# -a 는 Array 형 변수에 값을 추가하는 것
set -as terminal-features ",xterm-256color:RGB"


# ==============================================================================
# 2. 키 바인딩 설정 (Key Bindings)
# ==============================================================================

# 새 창/분할 패널 생성 시 현재 작업 디렉토리 유지
bind-key -T prefix c new-window -c "#{pane_current_path}"
bind-key -T prefix '"' split-window -c "#{pane_current_path}"
bind-key -T prefix % split-window -h -c "#{pane_current_path}"

# Ctrl + a 를 보조 prefix 키로 지정
set-option -g prefix2 C-a

# ==============================================================================
# 3. 상태바 레이아웃 및 디자인 (Status Bar Settings)
# ==============================================================================

# 상태바 갱신 주기 (기본값: 15초)
set -g status-interval 15

# 상태바 기본 스타일 및 정렬
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify left

# [좌측] 세션 표시 영역
set -g status-left-length 40
set -g status-left "#[bg=#b4befe,fg=#181825,bold] #S #[default] "

# 부분 스타일이 없다면 status-left-style로 기본 스타일을 지정할 수도 있음
# 현재는 "#[default] " 부분으로 마지막 공백 하나만 스타일을 다르게 주고 있어서
# 기본 스타일을 바꾸지 않음
# set -g status-left-style "bg=#b4befe,fg=#181825,bold"

# [우측] 현재 디렉토리명, gitmux 상태, 현재 시간
set -g status-right-length 80
set -g status-right '#[fg=colour14]#{b:pane_current_path} #(gitmux -cfg ~/.config/tmux/gitmux.conf "#{pane_current_path}") #[default]| %H:%M '

# 상태바 2줄
set -g status 2
# 상태바 첫째줄 포맷을 둘째줄로 옮기고, 첫째줄은 비워둠
# -g 옵션은 따옴표, 옵션 이름 없이 옵션값만 가져오는 플래그
run-shell '
  # 1. tmux 사용자 정의 변수 조회
  orig0="$(tmux show-options -gv @orig_status_format_0 2>/dev/null)"
  orig1="$(tmux show-options -gv @orig_status_format_1 2>/dev/null)"

  # 2. 0번 백업 (최초 1회 실행)
  if [ -z "$orig0" ]; then
    orig0="$(tmux show-options -gv "status-format[0]")"
    tmux set-option -g @orig_status_format_0 "$orig0"
  fi

  # 3. 1번 백업 (최초 1회 실행 - 패인 목록 등이 담긴 기본 2행)
  if [ -z "$orig1" ]; then
    orig1="$(tmux show-options -gv "status-format[1]")"
    tmux set-option -g @orig_status_format_1 "$orig1"
  fi

  # 4. 0번을 비우고 원본 0번 포맷을 1번에 적용
  tmux set-option -g status-format[0] ""
  tmux set-option -g status-format[1] "$orig0"
'


# ==============================================================================
# 4. 윈도우 탭 스타일 (Window Tab Styling)
# ==============================================================================

# 1. 색상 정의 (여기서 한 번만 수정하면 전체에 반영됨)
set -g @tab_bg "#313244"
set -g @tab_fg "#a6adc8"
set -g @tab_curr_bg "colour68"
set -g @tab_curr_fg "#11111b"
set -g @tab_sep_fg "#45475a"
set -g @win_flag_curr_fg "colour195"
set -g @win_flag_fg "colour251"

# # 윈도우 상태 지정시 *-style 은 기본 스타일을 지정하고 *-format 은 내용을 지정
# # *-format 내에서도 #[...] 형식으로 부분 스타일을 지정할 수 있고
# # #[default] 는 *-style 에 지정한 스타일을 의미함

# 2. 윈도우 스타일 등록
set -g window-status-style "fg=#{E:@tab_fg},bg=#{E:@tab_bg}"
set -g window-status-current-style "fg=#{E:@tab_curr_fg},bg=#{E:@tab_curr_bg},bold"

# 3. 구분선 모듈화 정의 (마지막 탭이 아닐 때만 탭 배경색 위에 실선 출력)
set -g @tab_sep "#{?window_end_flag,,#[none]#[fg=#{E:@tab_sep_fg}]#[bg=#{E:@tab_bg}]│}"

# 4. 윈도우 플래그에 색상 적용
# # #F 는 Window Flags로 현재 윈도우 상태에 따라 *, _, # 등의 값이 출력된다.
set -g @win_flag_curr "#{?window_flags, #[fg=#{E:@win_flag_curr_fg}]#F,}"
set -g @win_flag "#{?window_flags, #[fg=#{E:@win_flag_fg}]#F,}"

# 5. 포맷 적용 (구분선은 비우고 포맷 끝에 #{E:@tab_sep}만 부착)
set -g window-status-separator ""
set -g window-status-format " #I:#W#{E:@win_flag} #{E:@tab_sep}"
set -g window-status-current-format " #I:#W#{E:@win_flag_curr} #{E:@tab_sep}"


# ==============================================================================
# 5. 패널 테두리 및 상태 표시 (Pane Border Styling)
# ==============================================================================

# 패널 상단 테두리에 상태 표시줄 활성화
set -g pane-border-status top

# 패널 테두리 색상 (비활성: 은은한 회색 / 활성: 굵은 하늘색)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=#00afff,bold"

# 테두리 표시 포맷: [Pane 번호] 현재 경로 | 실행 명령어 (활성 패널 강조)
set -g pane-border-format " #{?pane_active,#[fg=colour14]#[bold]#[underscore],#[fg=colour8]}[#P] #{pane_current_path} | #{pane_current_command} "


# ==============================================================================
# 6. 외부 설정 로드 (OS Specific & Local Overrides)
# ==============================================================================

# OS 전용 설정 및 로컬 커스텀 파일 로드 (-q 옵션으로 부재 시 무시)
source-file -q ~/.tmux.conf.darwin
source-file -q ~/.tmux.conf.linux
source-file -q ~/.tmux.conf.local
