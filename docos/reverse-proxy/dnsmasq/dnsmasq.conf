# ==============================================================================
# 1. 기본 서버 및 네트워크 동작 설정
# ==============================================================================
# Dnsmasq 동작 포트 (기본 53)
port=53

# OS 기본 /etc/resolv.conf 참고 안 함 (외부 DNS를 직접/프록시로 제어하기 위함)
no-resolv

# 상위 DNS 요청 시 무작위 포트 사용 (DNS 스푸핑 방지)
query-port=0

# 유효하지 않은 도메인 포맷(점 없는 단어 등)은 상위 DNS로 넘기지 않음
domain-needed

# 사설 IP 대역(192.168.x.x, 10.x.x.x 등)의 역방향(PTR) 조회가
# 자체 설정에 없으면 외부 상위 DNS로 넘기지 않음
bogus-priv


# ==============================================================================
# 2. 성능 및 캐시 설정
# ==============================================================================
# 캐시할 DNS 레코드 개수 (기본 150 -> 1000으로 확장)
cache-size=1000

# 상위 DNS로부터 받은 부정적 응답(NXDOMAIN)도 캐싱하여 재질의 방지
no-negcache


# ==============================================================================
# 3. 외부 상위(Upstream) DNS 설정 (DoH 프록시 연동)
# ==============================================================================
# 외부 인터넷 도메인 질의는 로컬 5353 포트의 cloudflared(DoH 프록시)로 전송
server=dnscrypt-proxy#5353

# ==============================================================================
# 4. 로컬 도메인 정적 매핑 (Self-hosted / 개발 환경)
# ==============================================================================
# 단일 IP 매핑 예제
# host-record=myproject.local,127.0.0.1
# 와일드카드 매핑 예제 (*.dev.local 은 모두 127.0.0.1 로 응답)
# leading dot(.)의 유무에 관계 없이 와일드카드 매핑으로 동작
# address=/.dev.local/127.0.0.1
# address=/.test.internal/192.168.1.100

address=/internal/127.0.0.1
address=/internal/::1

address=/lan/127.0.0.1
address=/lan/::1

address=/lab/127.0.0.1
address=/lab/::1

address=/priv/127.0.0.1
address=/priv/::1

address=/home.arpa/127.0.0.1
address=/home.arpa/::1

local=/internal/
local=/lan/
local=/lab/
local=/priv/
local=/home.arpa/

# ==============================================================================
# 5. Split-DNS 설정 (특정 사내망 도메인 분기 및 격리)
# ==============================================================================
# *.corp.internal 은 사내 내부 DNS 서버(10.10.0.53)로만 포워딩
# server=/corp.internal/10.10.0.53

# 사내 내부 DNS에서도 답을 못 찾을 경우, 인터넷 외부 DNS(127.0.0.1#5353)로 유출되는 것 차단
# local=/corp.internal/
# ==============================================================================
# 6. 보안 및 차단 (광고/악성 도메인 Sinkhole)
# ==============================================================================
# 특정 도메인을 0.0.0.0 로 응답시켜 차단 (Sinkhole 방식)
# IPv6 (AAAA 레코드는 차단 안 됨)
# address=/doubleclick.net/0.0.0.0
# address=/analytics.google.com/0.0.0.0
#
# 빈 응답(NODATA / Empty Response) 방식으로 차단
# 클라이언트는 주소가 없으므로 연결 시도를 안 함
# address=/doubleclick.net/
# address=/analytics.google.com/
#
# IPv4, IPv6 모두 Sinkhole 방식으로 차단
# Null IP, 즉, 0.0.0.0 과 :: 으로 각각 응답시켜 차단 (Sinkhole)
# 클라이언트는 Null IP 주소로 연결시도를 하지만, 유효하지 않은 주소이므로 연결 거부됨
# address=/doubleclick.net/#
# address=/analytics.google.com/#
# ==============================================================================
# 7. 디버깅 및 로그 (필요 시 주석 해제)
# ==============================================================================
# 들어오는 모든 DNS 쿼리를 로그로 남김 (/var/log/messages 또는 syslog)
# log-queries
# 쿼리가 어떤 Upstream DNS로 포워딩되는지 상세 로그 출력
# log-facility=/var/log/dnsmasq.log
